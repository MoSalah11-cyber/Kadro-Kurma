<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%); color: #ecf0f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #login-screen { text-align: center; background: rgba(15, 45, 25, 0.6); backdrop-filter: blur(15px); padding: 40px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 350px; }
        #login-screen h1 { font-weight: 800; margin-top: 0; color: #2ecc71; letter-spacing: 2px; font-size: 32px; }
        #nickname-input { width: 100%; padding: 15px; margin-bottom: 20px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-size: 16px; text-align: center; outline: none; }
        #nickname-input:focus { border-color: #2ecc71; }
        .play-btn { background: #27ae60; color: white; border: none; padding: 15px 20px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .play-btn:hover { background: #2ecc71; transform: translateY(-2px); }
        #game-container { display: none; width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        #capture-area { padding: 30px 20px; border-radius: 20px; background: linear-gradient(135deg, #0a1f12 0%, #020604 100%); border: 3px solid #f1c40f; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .capture-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(241, 196, 15, 0.3); }
        .capture-header h2 { margin: 0; color: #f1c40f; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        .score-badge { display: inline-block; margin-top: 10px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 25px; font-weight: 800; color: #2ecc71; border: 1px solid #2ecc71; }
        .pitch { background: rgba(255, 255, 255, 0.02); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        .row { display: flex; justify-content: space-evenly; width: 100%; }
        .slot-container { display: flex; flex-direction: column; align-items: center; width: 80px; text-align: center; }
        .slot { width: 60px; height: 85px; background: rgba(0, 0, 0, 0.6); border: 2px dashed rgba(255,255,255,0.3); border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; background-size: cover; background-position: center top; font-size: 24px; color: rgba(255,255,255,0.3); }
        .slot.filled { border: 2px solid #2ecc71; color: transparent; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.2); }
        .pos-badge { background: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-top: -10px; z-index: 2; border: 1px solid #f1c40f; color: #f1c40f; }
        .criteria { font-size: 9px; margin-top: 5px; color: #bdc3c7; font-weight: 600; line-height: 1.1; }
        .player-name { font-size: 10px; font-weight: 800; margin-top: 4px; color: #fff; display: none; background: rgba(0,0,0,0.6); padding: 2px 4px; border-radius: 4px; }
        #final-share-btn { display: none; width: 100%; margin-top: 20px; padding: 15px; background: #fff; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        #final-share-btn:hover { background: #f1c40f; transform: scale(1.02); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 10; }
        #search-modal-content { background: #111; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .search-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #2ecc71; font-weight: 800; }
        input[type="text"].search-input { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; margin-bottom: 15px; background: rgba(0,0,0,0.4); color: #fff; outline: none; }
        input[type="text"].search-input.error { border-color: #e74c3c; animation: shake 0.4s; }
        .results { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; text-align: left; }
        .player-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .player-item img { width: 35px; height: 35px; border-radius: 5px; margin-right: 10px; object-fit: cover; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        #result-modal-content { background: #111; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        #generated-image-preview { width: 100%; border-radius: 12px; border: 2px solid #f1c40f; margin: 15px 0; }
        .social-btn { padding: 12px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; color: #fff; width: 100%; margin-bottom: 10px; }
        .btn-download { background: #34495e; }
        .close-btn { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 800; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 id="loading-text">YÜKLENİYOR...</h1>
        <div id="login-form" style="display:none;">
            <h1>GRID 11</h1>
            <input type="text" id="nickname-input" placeholder="Nickname girin..." autocomplete="off">
            <button class="play-btn" onclick="startGame()">OYNA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="capture-area">
            <div class="capture-header">
                <h2 id="capture-title">---'in İlk 11'i</h2>
                <div class="score-badge">Deneme: <span id="scoreVal">0</span></div>
            </div>
            <div class="pitch" id="pitch"></div>
        </div>
        <button id="final-share-btn" onclick="generateShareImage()">PAYLAŞ</button>
    </div>

    <div class="modal" id="search-modal">
        <div id="search-modal-content">
            <div class="search-header">
                <span id="search-pos-title">Oyuncu Ara</span>
                <span style="font-size: 14px; color: #bdc3c7; cursor: pointer;" onclick="closeModal('search-modal')">✖</span>
            </div>
            <div style="font-size:11px; color:#f1c40f; margin-bottom:10px;" id="search-criteria-hint"></div>
            <input type="text" id="searchInput" class="search-input" placeholder="Futbolcu ara..." autocomplete="off">
            <div class="results" id="resultsList"></div>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            <h2 style="margin:0; color:#f1c40f;">TEBRİKLER!</h2>
            <img id="generated-image-preview" src="">
            <button class="social-btn btn-download" onclick="downloadImage()">Görseli İndir</button>
            <button class="close-btn" onclick="closeModal('result-modal')">Kapat</button>
        </div>
    </div>

    <script>
        let dbPlayers = [];
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let activeCriteria = null;
        let username = "";
        let generatedImageData = "";
        let gunlukKadro = [];

        // Diziliş Havuzu
        const dizilisler = [
            { ad: "4-4-2", hatlar: [ ["ST", "ST"], ["LM", "CM", "CM", "RM"], ["LB", "CB", "CB", "RB"], ["GK"] ] },
            { ad: "4-3-3", hatlar: [ ["LW", "ST", "RW"], ["CM", "CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"] ] },
            { ad: "4-2-3-1", hatlar: [ ["ST"], ["LM", "CAM", "RM"], ["CDM", "CDM"], ["LB", "CB", "CB", "RB"], ["GK"] ] },
            { ad: "3-5-2", hatlar: [ ["ST", "ST"], ["LM", "CM", "CDM", "CM", "RM"], ["CB", "CB", "CB"], ["GK"] ] },
            { ad: "5-3-2", hatlar: [ ["ST", "ST"], ["CM", "CM", "CM"], ["LWB", "CB", "CB", "CB", "RWB"], ["GK"] ] },
            { ad: "4-5-1", hatlar: [ ["ST"], ["LM", "CM", "CM", "CM", "RM"], ["LB", "CB", "CB", "RB"], ["GK"] ] }
        ];

        // Görev Havuzu
        const ulkeler = [
            { ad: "Brezilyalı", kod: "Brazil" }, { ad: "Arjantinli", kod: "Argentina" }, { ad: "Uruguaylı", kod: "Uruguay" },
            { ad: "Alman", kod: "Germany" }, { ad: "Fransız", kod: "France" }, { ad: "İngiliz", kod: "England" },
            { ad: "İspanyol", kod: "Spain" }, { ad: "İtalyan", kod: "Italy" }, { ad: "Hollandalı", kod: "Netherlands" },
            { ad: "Belçikalı", kod: "Belgium" }, { ad: "Türk", kod: "Turkey" }, { ad: "Nijeryalı", kod: "Nigeria" },
            { ad: "Senegalli", kod: "Senegal" }, { ad: "Fildişili", kod: "Cote d'Ivoire" }, { ad: "Ganalı", kod: "Ghana" }
        ];

        const kriterHavuzu = {
            "GK": [
                { metin: "3+ Kariyer Golü", kontrol: (p) => parseInt(p.goals) >= 3 },
                { metin: "Kariyer Boyu Tek Takım", kontrol: (p) => parseInt(p.player_club_id) === 1 }
            ],
            "DEF": [ // CB, LB, RB, LWB, RWB
                { metin: "5+ Kırmızı Kart", kontrol: (p) => parseInt(p.red_cards) >= 5 },
                { metin: "7+ Kırmızı Kart", kontrol: (p) => parseInt(p.red_cards) >= 7 },
                { metin: "8+ Farklı Takımda Oynamış", kontrol: (p) => parseInt(p.player_club_id) >= 8 }
            ],
            "MID": [ // CM, CDM, CAM, RM, LM, RW, LW
                { metin: "200+ Asist", kontrol: (p) => parseInt(p.assists) >= 200 },
                { metin: "5+ Kırmızı Kart", kontrol: (p) => parseInt(p.red_cards) >= 5 },
                { metin: "Kariyer Boyu Tek Takım", kontrol: (p) => parseInt(p.player_club_id) === 1 }
            ],
            "ATT": [ // ST, CF
                { metin: "400+ Gol", kontrol: (p) => parseInt(p.goals) >= 400 },
                { metin: "200+ Asist", kontrol: (p) => parseInt(p.assists) >= 200 },
                { metin: "8+ Farklı Takımda Oynamış", kontrol: (p) => parseInt(p.player_club_id) >= 8 }
            ]
        };

        // Ülkeleri genel kriterlere ekliyoruz
        const genelKriterler = [];
        ulkeler.forEach(u => {
            genelKriterler.push({ metin: u.ad, kontrol: (p) => p.country_of_citizenship === u.kod });
        });

        // Seed fonksiyonu (Tarihe göre rastgelelik)
        function getDailySeed() {
            const today = new Date();
            return today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
        }

        function seededRandom(seed) {
            var t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        // CSV Verisini Çekme
        window.onload = function() {
            fetch('grid_players.csv')
                .then(response => {
                    if (!response.ok) throw new Error("Veritabanı bulunamadı");
                    return response.text();
                })
                .then(text => {
                    parseCSV(text);
                    document.getElementById("loading-text").style.display = "none";
                    document.getElementById("login-form").style.display = "block";
                    gunlukKuraCek();
                })
                .catch(err => {
                    alert("Veriler yüklenirken hata oldu kanka. grid_players.csv dosyasını GitHub'a yüklediğinden emin ol.");
                    console.error(err);
                });
        };

        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = lines[0].split(',');
            
            for(let i = 1; i < lines.length; i++) {
                if(!lines[i].trim()) continue;
                // Virgülleri güvenli ayırma (isim içinde virgül olma ihtimaline karşı basit bypass)
                const currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if(currentline.length === headers.length) {
                    let player = {};
                    for(let j=0; j<headers.length; j++){
                        player[headers[j].trim()] = currentline[j].replace(/"/g, '').trim();
                    }
                    dbPlayers.push(player);
                }
            }
        }

        function getMevkiGrup(pos) {
            if(pos === "GK") return "GK";
            if(["CB", "LB", "RB", "LWB", "RWB"].includes(pos)) return "DEF";
            if(["CM", "CDM", "CAM", "RM", "LM", "RW", "LW"].includes(pos)) return "MID";
            return "ATT";
        }

        function gunlukKuraCek() {
            let seed = getDailySeed();
            
            // Rastgele diziliş
            const dizilisIndex = Math.floor(seededRandom(seed++) * dizilisler.length);
            const secilenDizilis = dizilisler[dizilisIndex];
            
            let idCounter = 0;
            gunlukKadro = [];

            secilenDizilis.hatlar.forEach(hat => {
                let hatDizisi = [];
                hat.forEach(pos => {
                    let grup = getMevkiGrup(pos);
                    
                    // Ya pozisyona özel kriter, ya da genel ülke kriteri seç (%50 şans)
                    let secilenKriter;
                    if(seededRandom(seed++) > 0.5) {
                        let havuz = kriterHavuzu[grup];
                        secilenKriter = havuz[Math.floor(seededRandom(seed++) * havuz.length)];
                    } else {
                        secilenKriter = genelKriterler[Math.floor(seededRandom(seed++) * genelKriterler.length)];
                    }

                    hatDizisi.push({
                        id: "slot-" + idCounter++,
                        pos: pos,
                        kriterMetin: secilenKriter.metin,
                        kontrol: secilenKriter.kontrol
                    });
                });
                gunlukKadro.push(hatDizisi);
            });
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) {
                alert("En az 3 harfli bir nickname gir reis.");
                return;
            }
            username = input;
            document.getElementById("capture-title").innerText = `${username}'in İlk 11'i`;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            
            renderPitch();
        }

        function renderPitch() {
            const pitch = document.getElementById("pitch");
            pitch.innerHTML = "";
            
            gunlukKadro.forEach(hat => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                
                hat.forEach(slot => {
                    const slotHtml = `
                        <div class="slot-container">
                            <div class="slot" id="${slot.id}-btn" onclick="openSearch('${slot.id}')">+</div>
                            <div class="pos-badge">${slot.pos}</div>
                            <div class="player-name" id="${slot.id}-name"></div>
                            <div class="criteria">${slot.kriterMetin}</div>
                        </div>
                    `;
                    rowDiv.innerHTML += slotHtml;
                });
                pitch.appendChild(rowDiv);
            });
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            
            activeSlotId = slotId;
            let targetSlot = null;
            gunlukKadro.forEach(hat => hat.forEach(s => { if(s.id === slotId) targetSlot = s; }));
            activeCriteria = targetSlot;

            document.getElementById("search-pos-title").innerText = targetSlot.pos + " ARANIYOR";
            document.getElementById("search-criteria-hint").innerText = "Şart: " + targetSlot.kriterMetin;
            
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function normalizeText(text) {
            return text.replace(/İ/g, 'i').replace(/I/g, 'i').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeText(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            // Filtreleme: İsme göre ara
            const filtered = dbPlayers.filter(p => normalizeText(p.name).includes(val)).slice(0, 30); // En fazla 30 sonuç getir

            filtered.forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                // Proxy ile resim çekme
                let proxyImg = "https://api.allorigins.win/raw?url=" + player.image_url;
                div.innerHTML = `<img src="${proxyImg}" onerror="this.src='https://cdn.sofifa.net/players/notfound_0_120.png'"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player, proxyImg);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player, proxyImg) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const inputField = document.getElementById("searchInput");

            // Kriter kontrolü
            if (activeCriteria.kontrol(player)) {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${proxyImg})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "inline-block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        function generateShareImage() {
            const captureArea = document.getElementById("capture-area");
            const shareBtn = document.getElementById("final-share-btn");
            shareBtn.innerText = "YÜKLENİYOR...";
            
            html2canvas(captureArea, {
                backgroundColor: "#020604",
                scale: 2,
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                generatedImageData = canvas.toDataURL("image/jpeg", 0.9);
                document.getElementById("generated-image-preview").src = generatedImageData;
                document.getElementById("result-modal").style.display = "flex";
                shareBtn.innerText = "PAYLAŞ";
            }).catch(err => {
                alert("Fotoğraf oluşturulurken bir hata oldu hacım: " + err);
                shareBtn.innerText = "PAYLAŞ";
            });
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `Grid11_${username}_Skor${score}.jpg`;
            link.href = generatedImageData;
            link.click();
        }
    </script>
</body>
</html>
