<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günün Gridi - Efsaneler Modu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'VT323', monospace; 
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 24px; 
        }

        #flash-effect {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-out;
        }

        .flash-active { opacity: 1 !important; transition: none !important; }

        #login-screen {
            text-align: center;
            background: rgba(15, 45, 25, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }

        #login-screen h1 {
            margin-top: 0;
            color: #2ecc71;
            font-size: 52px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        #nickname-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 24px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus { border-color: #2ecc71; }

        .play-btn {
            background: #555;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 32px;
            cursor: not-allowed;
            transition: 0.3s;
            font-family: inherit;
            letter-spacing: 2px;
        }

        .play-btn:disabled { background: #555 !important; transform: none !important; }
        .play-btn.active-btn { background: #27ae60; cursor: pointer; }
        .play-btn.active-btn:hover { background: #2ecc71; transform: translateY(-2px); }

        #db-status {
            font-size: 20px;
            color: #f1c40f;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-direction: column;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #f1c40f;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .user-info { font-size: 32px; color: #2ecc71; text-transform: uppercase; }
        .score-box {
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 8px;
            color: #f1c40f;
            border: 1px solid rgba(241, 196, 15, 0.3);
            font-size: 26px;
        }

        .pitch {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 5px;
        }

        .row {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 15px;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            text-align: center;
        }

        .slot {
            width: 65px;
            height: 85px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            background-size: cover;
            background-position: center top;
            font-size: 28px;
            color: rgba(255,255,255,0.3);
            font-family: 'Poppins', sans-serif; 
        }

        .slot.filled {
            border: 2px solid #2ecc71;
            color: transparent; 
        }

        .pos-badge {
            background: #000;
            font-size: 18px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: -12px;
            z-index: 2;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .criteria {
            font-size: 15px;
            margin-top: 6px;
            color: #bdc3c7;
            line-height: 1.1;
        }

        .player-name {
            font-family: 'Poppins', sans-serif; 
            font-size: 10px;
            font-weight: 800;
            margin-top: 4px;
            color: #fff;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 2px 4px;
            border-radius: 4px;
        }

        #final-share-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 32px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        #final-share-btn:hover { background: #2ecc71; color: #fff; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #search-modal-content {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #2ecc71;
            font-size: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 20px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            background: rgba(0,0,0,0.4);
            color: #fff;
        }

        input[type="text"]:focus { border-color: #2ecc71; }
        input[type="text"].error { border-color: #e74c3c; animation: shake 0.4s; }

        .results {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif; 
            font-weight: 600;
            font-size: 13px;
        }

        .player-item img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        #result-modal-content {
            background: transparent;
            padding: 0;
            border: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #ss-card {
            background-color: #0b1c11; 
            border: 2px solid #2ecc71; 
            border-radius: 12px;
            padding: 20px;
            width: 85%; 
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }

        .close-btn {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-family: inherit;
            cursor: pointer;
            font-size: 28px;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="flash-effect"></div>

    <div id="login-screen">

            </div>

    <div id="game-container">
        <div class="header">
            <div class="user-info" id="display-nickname">---</div>
            <div class="score-box">Skor: <span id="scoreVal">0</span></div>

    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            <div id="ss-card">
                <h2 id="ss-title" style="margin: 0 0 10px 0; color: #fff; text-align: center; text-transform: uppercase;">---'in Kadrosu</h2>

                    <span id="ss-score" style="background:#f1c40f; color:#000; padding:4px 15px; border-radius:20px;">Skor: 0</span>
                </div>
                <div id="ss-pitch-container"></div>
            </div>
            <button class="close-btn" onclick="shareOrDownload()">İNDİR / PAYLAŞ</button>

    <script>
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let username = "";
        
        let dailyFormationLayout = [];
        let todayGrid = {};
        let dbPlayers = []; 
        const statsMap = {}; 

        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // HIZLI VE MANUEL CSV SATIR PARÇALAYICI
        const parseRow = (str) => {
            let arr = [], quote = false, val = '';
            for (let i = 0; i < str.length; i++) {
                let cc = str[i];
                if (cc === '"') quote = !quote;
                else if (cc === ',' && !quote) { arr.push(val.trim().replace(/^"|"$/g, '')); val = ''; }
                else val += cc;
            }
            arr.push(val.trim().replace(/^"|"$/g, ''));
            return arr;
        };

        // DONDURMAYAN, GÜVENLİ CUSTOM CSV YÜKLEYİCİ
        async function fetchAndProcessCSV(filename, msgPrefix, processFn) {
            const msgEl = document.getElementById("loading-msg");
            msgEl.innerText = `${msgPrefix} (İndiriliyor...)`;
            
            const response = await fetch('./' + filename + '?v=' + new Date().getTime());
            if (!response.ok) throw new Error(`Dosya bulunamadı (HTTP ${response.status})`);
            
            const text = await response.text();
            
            // 404 HTML KONTROLÜ (GitHub Pages koruması)
            if (text.trim().toLowerCase().startsWith('<!doctype') || text.trim().toLowerCase().startsWith('<html')) {
                throw new Error("404 HTML sayfası döndü, dosya eksik!");
            }

            msgEl.innerText = `${msgPrefix} (İşleniyor...)`;
            await new Promise(r => setTimeout(r, 50)); // Tarayıcıya nefes aldır

            const lines = text.split('\n');
            const headers = lines[0].toLowerCase().split(',').map(h => h.trim().replace(/['"]/g, ''));
            
            let processed = 0;
            // 15.000 satırlık paketler halinde işleyip telefonu dondurmasını engelliyoruz
            for (let i = 1; i < lines.length; i += 15000) {
                let batch = lines.slice(i, i + 15000);
                
                for(let line of batch) {
                    if(!line || line.trim() === "") continue;
                    let cols = parseRow(line);
                    let rowObj = {};
                    headers.forEach((h, idx) => rowObj[h] = cols[idx]);
                    processFn(rowObj);
                }
                processed += batch.length;
                msgEl.innerText = `${msgPrefix} (${processed.toLocaleString('tr-TR')} satır)`;
                await new Promise(r => setTimeout(r, 0)); // Arayüzü güncelle ve bekle
            }
        }

        async function loadLargeDatabase() {
            const msgEl = document.getElementById("loading-msg");
            const spinner = document.getElementById("loading-spinner");
            const errEl = document.getElementById("error-msg");
            const startBtn = document.getElementById("start-btn");

            try {
                // ADIM 1: APPEARANCES (Maç istatistikleri ve kulüpler)
                await fetchAndProcessCSV('appearances.csv', 'Maçlar Okunuyor', (row) => {
                    let pid = row.player_id;
                    if (!pid) return;
                    if (!statsMap[pid]) {
                        statsMap[pid] = { appsCount: 0, goals: 0, redCards: 0, clubs: new Set(), comps: new Set(), clubApps: {} };
                    }
                    let p = statsMap[pid];
                    p.appsCount++;
                    if (row.goals) p.goals += parseInt(row.goals);
                    if (row.red_cards) p.redCards += parseInt(row.red_cards);
                    if (row.player_club_id) {
                        p.clubs.add(row.player_club_id);
                        p.clubApps[row.player_club_id] = (p.clubApps[row.player_club_id] || 0) + 1;
                    }
                    if (row.competition_id) p.comps.add(row.competition_id.toUpperCase());
                });

                // ADIM 2: PLAYERS (Ana oyuncu verileri)
                await fetchAndProcessCSV('players.csv', 'Oyuncular Harmanlanıyor', (row) => {
                    let pName = row.name || row.player_name || "";
                    if (pName.length < 2) return;
                    
                    let pid = row.player_id;
                    let pNat = (row.country_of_citizenship || "").toLowerCase();
                    let pFoot = (row.foot || "").toLowerCase();
                    let height = parseInt(row.height_in_cm || 0);
                    let birthYear = row.date_of_birth && row.date_of_birth.length >= 4 ? parseInt(row.date_of_birth.substring(0, 4)) : 0;
                    
                    let pImg = row.image_url;
                    if (!pImg || pImg.length < 5) pImg = `https://img.a.transfermarkt.technology/portrait/header/${pid}.jpg?lm=1`;
                    if (pImg.includes('transfermarkt')) pImg = `https://wsrv.nl/?url=${pImg.replace('https://', '').replace('http://', '')}&w=120&h=160&fit=cover`;

                    let pStats = statsMap[pid] || { appsCount: 0, goals: 0, redCards: 0, clubs: new Set(), comps: new Set(), clubApps: {} };
                    let c = pStats.clubs;
                    let teamsCount = c.size; // Takım sayısını formalardan alıyoruz

                    const traits = ["herkes"];
                    
                    if(pNat.includes("turkey") || pNat.includes("türkiye")) traits.push("turkiye");
                    if(pNat.includes("brazil")) traits.push("brezilya");
                    if(pNat.includes("argentina")) traits.push("arjantin");
                    if(pNat.includes("germany")) traits.push("almanya");
                    if(pNat.includes("england")) traits.push("ingiltere");
                    if(pNat.includes("spain")) traits.push("ispanya");
                    if(pNat.includes("france")) traits.push("fransa");
                    if(pNat.includes("italy")) traits.push("italya");
                    if(pNat.includes("netherlands") || pNat.includes("holland")) traits.push("hollanda");

                    if (height > 0 && height <= 175) traits.push("boy_175_alt");
                    if (birthYear >= 1990 && birthYear <= 1999) traits.push("dogum_90lar");
                    if (birthYear >= 2000) traits.push("dogum_2000ler");
                    if (pFoot === 'left') traits.push("sol_ayak");

                    if (c.has('418') && c.has('131')) traits.push("real_barca");
                    if (c.has('418') && c.has('13')) traits.push("real_atletico");
                    if (c.has('131') && c.has('13')) traits.push("barca_atletico");
                    if (c.has('46') && c.has('5')) traits.push("inter_milan");
                    if (c.has('27') && c.has('16')) traits.push("bayern_dortmund");
                    if (c.has('141') && c.has('36')) traits.push("gs_fb");
                    if (c.has('141') && c.has('114')) traits.push("gs_bjk");
                    if (c.has('141') && c.has('449')) traits.push("gs_ts");
                    if (c.has('36') && c.has('114')) traits.push("fb_bjk");
                    if (c.has('36') && c.has('449')) traits.push("fb_ts");
                    if (c.has('114') && c.has('449')) traits.push("bjk_ts");

                    let top5 = 0;
                    if (pStats.comps.has("GB1") || Array.from(c).some(cid => ['11', '31', '985', '281', '379', '148'].includes(cid))) top5++;
                    if (pStats.comps.has("ES1") || Array.from(c).some(cid => ['418', '131', '13', '150', '1050', '368'].includes(cid))) top5++;
                    if (pStats.comps.has("IT1") || Array.from(c).some(cid => ['46', '5', '506', '416', '380', '12'].includes(cid))) top5++;
                    if (pStats.comps.has("L1") || Array.from(c).some(cid => ['27', '16', '15', '82', '79', '3'].includes(cid))) top5++;
                    if (pStats.comps.has("FR1") || Array.from(c).some(cid => ['583', '1041', '162', '855', '244', '1082'].includes(cid))) top5++;
                    
                    if (top5 >= 3) traits.push("top5_3_lig");
                    if (top5 === 0 && pStats.appsCount > 10) traits.push("bes_buyuk_yok");

                    let ulkeSayisi = Array.from(pStats.comps).filter(x => x.endsWith('1')).length;
                    if (ulkeSayisi >= 4) traits.push("ulke_4_farkli");
                    if (teamsCount >= 7) traits.push("takim_7_fazla");
                    if (Object.values(pStats.clubApps).some(v => v >= 200)) traits.push("tek_takim_200_mac");
                    if (teamsCount <= 2 && pStats.appsCount > 50) traits.push("tek_takim_kariyer");
                    if (pStats.appsCount >= 300) traits.push("mac_300");
                    if (pStats.redCards === 0 && pStats.appsCount >= 50) traits.push("sifir_kirmizi");

                    const isSuperLig = pStats.comps.has('TR1') || Array.from(c).some(cid => ['141','36','114','449','3209','2381','152','77','3216','236','10484'].includes(cid));

                    if (isSuperLig) {
                        if (pNat.includes('brazil')) traits.push("tr_brezilyali");
                        if (pNat.includes('germany')) traits.push("tr_alman");
                        if (pNat.includes('italy')) traits.push("tr_italyan");
                        if (pNat.includes('nigeria')) traits.push("tr_nijeryali");
                        if (pNat.includes('uruguay')) traits.push("tr_uruguayli");
                        
                        if (!c.has('141') && !c.has('36') && !c.has('114') && !c.has('449')) {
                            traits.push("dort_buyuk_yok");
                        }
                    }

                    if (c.has('31') && pNat.includes('italy')) traits.push("liv_italyan");
                    if (c.has('46') && pNat.includes('germany')) traits.push("inter_alman");
                    if (c.has('131') && pNat.includes('france')) traits.push("barca_fransiz");

                    if (pStats.goals >= 20) traits.push("gol_20_defans");
                    if (pStats.goals >= 100) traits.push("gol_100_hucum");
                    if (pStats.appsCount >= 100) traits.push("mac_100_kaleci");

                    dbPlayers.push({ name: pName, img: pImg, traits: traits });
                });

                // RAM'i Temizle
                for (let prop in statsMap) delete statsMap[prop];

                msgEl.innerText = `✓ OYUN HAZIR! (${dbPlayers.length.toLocaleString('tr-TR')} Topçu)`;
                spinner.style.display = "none";
                msgEl.parentElement.style.color = "#2ecc71";
                startBtn.disabled = false;
                startBtn.classList.add("active-btn");

            } catch (err) {
                console.error(err);
                spinner.style.display = "none";
                msgEl.innerText = "⚠ DOSYALAR OKUNAMADI";
                msgEl.parentElement.style.color = "#e74c3c";
                errEl.style.display = "block";
                errEl.innerHTML = err.message + `<br>GitHub deponda tam olarak <b>players.csv</b> ve <b>appearances.csv</b> olduğuna emin ol.`;
            }
        }

        const dizilisler = {
            "442": [["ST", "ST"], ["LM", "CM", "CM", "RM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "433": [["LM", "ST", "RM"], ["CM", "CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "4231": [["ST"], ["LM", "CM", "RM"], ["CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "352": [["ST", "ST"], ["LM", "CM", "CM", "CM", "RM"], ["CB", "CB", "CB"], ["GK"]]
        };

        const kriterKategorileri = {
            ULKE: [
                { text: "Brezilyalı", trait: "brezilya" },
                { text: "Arjantinli", trait: "arjantin" },
                { text: "Türk", trait: "turkiye" },
                { text: "Alman", trait: "almanya" },
                { text: "İngiliz", trait: "ingiltere" },
                { text: "İspanyol", trait: "ispanya" },
                { text: "Fransız", trait: "fransa" },
                { text: "İtalyan", trait: "italya" },
                { text: "Hollandalı", trait: "hollanda" }
            ],
            LIG_KULUP: [
                { text: "Real Madrid & Barcelona", trait: "real_barca" },
                { text: "Real Madrid & Atl. Madrid", trait: "real_atletico" },
                { text: "Barcelona & Atl. Madrid", trait: "barca_atletico" },
                { text: "İnter & Milan", trait: "inter_milan" },
                { text: "Bayern & Dortmund", trait: "bayern_dortmund" },
                { text: "Galatasaray & Fenerbahçe", trait: "gs_fb" },
                { text: "Galatasaray & Beşiktaş", trait: "gs_bjk" },
                { text: "Galatasaray & Trabzonspor", trait: "gs_ts" },
                { text: "Fenerbahçe & Beşiktaş", trait: "fb_bjk" },
                { text: "Fenerbahçe & Trabzonspor", trait: "fb_ts" },
                { text: "Beşiktaş & Trabzonspor", trait: "bjk_ts" },
                { text: "5 Büyük Ligin 3'ünde Oynamış", trait: "top5_3_lig" },
                { text: "5 Büyük Ligde Hiç Oynamamış", trait: "bes_buyuk_yok" },
                { text: "Süper Lig'de 4 Büyükte Oynamamış", trait: "dort_buyuk_yok" }
            ],
            FIZIKSEL: [
                { text: "Sol Ayaklı", trait: "sol_ayak" },
                { text: "1.75m ve Altı Boy", trait: "boy_175_alt" },
                { text: "90'lar Doğumlu (90-99)", trait: "dogum_90lar" },
                { text: "2000 ve Sonrası Doğumlu", trait: "dogum_2000ler" }
            ],
            KARIYER: [
                { text: "En Az 4 Farklı Ülkede Oynamış", trait: "ulke_4_farkli" },
                { text: "Kariyerinde 7+ Takımda Oynamış", trait: "takim_7_fazla" },
                { text: "Tek Bir Takımda 200+ Maç", trait: "tek_takim_200_mac" },
                { text: "Kariyeri Boyu Tek Takımda Oynamış", trait: "tek_takim_kariyer" },
                { text: "Kariyerinde 300+ Resmi Maç", trait: "mac_300" },
                { text: "Hiç Kırmızı Kart Görmemiş", trait: "sifir_kirmizi" }
            ],
            MELEZ: [
                { text: "Süper Lig'de Oynamış Brezilyalı", trait: "tr_brezilyali" },
                { text: "Süper Lig'de Oynamış Alman", trait: "tr_alman" },
                { text: "Süper Lig'de Oynamış İtalyan", trait: "tr_italyan" },
                { text: "Süper Lig'de Oynamış Nijeryalı", trait: "tr_nijeryali" },
                { text: "Süper Lig'de Oynamış Uruguaylı", trait: "tr_uruguayli" },
                { text: "Liverpool'da Oynamış İtalyan", trait: "liv_italyan" },
                { text: "İnter'de Oynamış Alman", trait: "inter_alman" },
                { text: "Barcelona'da Oynamış Fransız", trait: "barca_fransiz" }
            ],
            OZEL_DEFANS: [
                { text: "Kariyerinde 20+ Gol Atmış", trait: "gol_20_defans" }
            ],
            OZEL_HUCUM: [
                { text: "100+ Kariyer Golü", trait: "gol_100_hucum" }
            ],
            OZEL_KALECI: [
                { text: "Kariyerinde 100+ Maç", trait: "mac_100_kaleci" }
            ]
        };

        function generateDailyGrid() {
            const today = new Date();
            const dateString = today.getFullYear() + "" + today.getMonth() + "" + today.getDate();
            const rnd = mulberry32(parseInt(dateString));

            const formKeys = Object.keys(dizilisler);
            const selKey = formKeys[Math.floor(rnd() * formKeys.length)];
            dailyFormationLayout = dizilisler[selKey];

            let slotIndex = 0;
            todayGrid = {};
            const usedTraits = new Set();
            let ulkeKotas = 0; 

            const tumHavuz = [
                ...kriterKategorileri.ULKE.map(c => ({...c, cat: 'ULKE'})),
                ...kriterKategorileri.LIG_KULUP.map(c => ({...c, cat: 'LIG'})),
                ...kriterKategorileri.FIZIKSEL.map(c => ({...c, cat: 'FIZ'})),
                ...kriterKategorileri.KARIYER.map(c => ({...c, cat: 'KAR'})),
                ...kriterKategorileri.MELEZ.map(c => ({...c, cat: 'MEL'}))
            ];

            dailyFormationLayout.forEach(rowArr => {
                rowArr.forEach(pos => {
                    let mevcutHavuz = [...tumHavuz];
                    
                    if (pos === 'CB' || pos === 'LB' || pos === 'RB') {
                        mevcutHavuz = mevcutHavuz.concat(kriterKategorileri.OZEL_DEFANS.map(c => ({...c, cat: 'DEF'})));
                    } else if (pos === 'ST' || pos === 'RW' || pos === 'LW' || pos === 'CF') {
                        mevcutHavuz = mevcutHavuz.concat(kriterKategorileri.OZEL_HUCUM.map(c => ({...c, cat: 'HUC'})));
                    } else if (pos === 'GK') {
                        mevcutHavuz = mevcutHavuz.concat(kriterKategorileri.OZEL_KALECI.map(c => ({...c, cat: 'GK'})));
                    }

                    let shuffled = mevcutHavuz.sort(() => 0.5 - rnd());
                    let secilen = null;

                    for (let c of shuffled) {
                        if (usedTraits.has(c.trait)) continue;
                        
                        if (c.cat === 'ULKE') {
                            if (ulkeKotas < 3) {
                                ulkeKotas++;
                                secilen = c;
                                break;
                            } else {
                                continue; 
                            }
                        } else {
                            secilen = c;
                            break;
                        }
                    }
                    
                    if (!secilen) secilen = { text: "Herhangi Biri", trait: "herkes" };
                    usedTraits.add(secilen.trait);
                    
                    todayGrid[`slot-${slotIndex}`] = {
                        pos: pos,
                        criteriaText: secilen.text,
                        reqTrait: secilen.trait
                    };
                    slotIndex++;
                });
            });
        }

        window.onload = () => {
            generateDailyGrid(); 
            const savedName = localStorage.getItem("grid11_username");
            if (savedName) document.getElementById("nickname-input").value = savedName;
            loadLargeDatabase(); 
        };

        function normalizeMetin(metin) {
            return metin.replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                        .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) return alert("En az 3 harf girmelisin.");
            
            username = input;
            localStorage.setItem("grid11_username", username);
            document.getElementById("display-nickname").innerText = username;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            renderPitch();
        }

        function renderPitch() {
            const pitch = document.getElementById("pitch");
            pitch.innerHTML = "";
            let slotIndex = 0;

            dailyFormationLayout.forEach(rowArr => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                rowArr.forEach(pos => {
                    const slotId = `slot-${slotIndex}`;
                    const data = todayGrid[slotId];
                    rowDiv.innerHTML += `
                        <div class="slot-container" id="${slotId}-container">
                            <div class="slot" id="${slotId}-btn" onclick="openSearch('${slotId}')">+</div>
                            <div class="pos-badge">${data.pos}</div>
                            <div class="player-name" id="${slotId}-name"></div>
                            <div class="criteria">${data.criteriaText}</div>
                        </div>
                    `;
                    slotIndex++;
                });
                pitch.appendChild(rowDiv);
            });
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            activeSlotId = slotId;
            document.getElementById("search-pos-title").innerText = todayGrid[slotId].pos + " ARANIYOR";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeMetin(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            const filtered = dbPlayers.filter(p => normalizeMetin(p.name).includes(val));

            filtered.slice(0, 15).forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}" onerror="this.onerror=null; this.src='https://cdn.sofifa.net/players/notfound_0_120.png'"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqTrait = todayGrid[activeSlotId].reqTrait;
            const inputField = document.getElementById("searchInput");

            if (player.traits.includes(reqTrait) || reqTrait === "herkes") {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url('${player.img}'), url('https://cdn.sofifa.net/players/notfound_0_120.png')`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "inline-block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        function showShareScreen() {
            const flash = document.getElementById("flash-effect");
            flash.classList.add("flash-active");
            setTimeout(() => flash.classList.remove("flash-active"), 80);

            document.getElementById("ss-title").innerText = `${username}'in Kadrosu`;
            document.getElementById("ss-score").innerText = `Skor: ${score}`;
            document.getElementById("ss-pitch-container").innerHTML = document.getElementById("pitch").innerHTML;
            
            document.getElementById("result-modal").style.display = "flex";
        }

        function shareOrDownload() {
            const card = document.getElementById("ss-card");
            html2canvas(card, { backgroundColor: "#020604", scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL("image/jpeg", 0.9);
                const link = document.createElement('a');
                link.download = `Grid11_${username}_Skor${score}.jpg`;
                link.href = imgData;
                link.click();
            });
        }
    </script>
</body>
