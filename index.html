<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Ekran görüntüsü almak için html2canvas kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- GİRİŞ EKRANI --- */
        #login-screen {
            text-align: center;
            background: rgba(15, 45, 25, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }

        #login-screen h1 {
            font-weight: 800;
            margin-top: 0;
            color: #2ecc71;
            letter-spacing: 2px;
            font-size: 32px;
        }

        #nickname-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus { border-color: #2ecc71; }

        .play-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .play-btn:hover { background: #2ecc71; transform: translateY(-2px); }

        /* --- ANA OYUN EKRANI --- */
        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- POSTER (ÇEKİM) ALANI --- */
        #capture-area {
            padding: 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0f2d19 0%, #020604 100%);
            border: 2px solid #2ecc71;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
        }

        .capture-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .capture-header h2 {
            margin: 0;
            color: #2ecc71;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .capture-header .score-badge {
            display: inline-block;
            margin-top: 10px;
            background: rgba(0,0,0,0.6);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 800;
            color: #f1c40f;
            border: 1px solid rgba(241, 196, 15, 0.3);
            font-size: 14px;
        }

        /* Cam Efektli Saha */
        .pitch {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px 10px;
        }

        .row {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 25px;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            text-align: center;
        }

        .slot {
            width: 65px;
            height: 95px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            background-size: cover;
            background-position: center top;
            font-size: 24px;
            color: rgba(255,255,255,0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .slot.filled {
            border: 2px solid #f1c40f;
            color: transparent; 
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
        }

        .pos-badge {
            background: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: -12px;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.2);
            color: #2ecc71;
        }

        .criteria {
            font-size: 10px;
            margin-top: 8px;
            color: #bdc3c7;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .player-name {
            font-size: 11px;
            font-weight: 800;
            margin-top: 5px;
            color: #f1c40f;
            display: none;
        }

        /* FİNAL PAYLAŞ BUTONU (Emojisiz, Dümdüz) */
        #final-share-btn {
            display: none;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #final-share-btn:hover {
            background: #2ecc71;
            transform: scale(1.02);
        }

        /* --- MODALLAR --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #search-modal-content, #result-modal-content {
            background: #1a251e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #2ecc71;
            font-weight: 800;
        }

        /* PAYLAŞIM SONUÇ MODALI & BUTONLARI */
        #generated-image-preview {
            width: 100%;
            border-radius: 8px;
            border: 2px solid #2ecc71;
            margin: 15px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .social-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            color: #fff;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-download { background: #f39c12; grid-column: span 2; font-size: 15px;}
        .btn-download:hover { background: #f1c40f; }
        
        .btn-wp { background: #25D366; }
        .btn-wp:hover { background: #128C7E; }
        
        .btn-tw { background: #000000; border: 1px solid #333; }
        .btn-tw:hover { background: #1da1f2; }
        
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-ig:hover { opacity: 0.9; }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            background: rgba(0,0,0,0.4);
            color: #fff;
            transition: 0.2s;
        }

        input[type="text"]:focus { border-color: #2ecc71; }
        input[type="text"].error { border-color: #e74c3c; animation: shake 0.4s; }

        .results {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .player-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .player-item img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        .close-btn {
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #bdc3c7;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>GRID 11</h1>
        <p style="color: #bdc3c7; font-size: 14px; margin-bottom: 25px;">Futbol hafızanı test et.</p>
        <input type="text" id="nickname-input" placeholder="Nickname girin..." autocomplete="off">
        <button class="play-btn" onclick="startGame()">Günün Gridini Oyna</button>
    </div>

    <div id="game-container">
        
        <!-- İŞTE YENİ POSTER ALANI -->
        <div id="capture-area">
            <div class="capture-header">
                <h2 id="capture-title">---'in İlk 11'i</h2>
                <div class="score-badge">Toplam Skor: <span id="scoreVal">0</span></div>
            </div>

            <div class="pitch" id="pitch">
                <div class="row">
                    <div class="slot-container" id="slot-st-l"></div>
                    <div class="slot-container" id="slot-st-r"></div>
                </div>
                <div class="row">
                    <div class="slot-container" id="slot-lm"></div>
                    <div class="slot-container" id="slot-cm-l"></div>
                    <div class="slot-container" id="slot-cm-r"></div>
                    <div class="slot-container" id="slot-rm"></div>
                </div>
                <div class="row">
                    <div class="slot-container" id="slot-lb"></div>
                    <div class="slot-container" id="slot-cb-l"></div>
                    <div class="slot-container" id="slot-cb-r"></div>
                    <div class="slot-container" id="slot-rb"></div>
                </div>
                <div class="row">
                    <div class="slot-container" id="slot-gk"></div>
                </div>
            </div>
        </div>

        <button id="final-share-btn" onclick="generateShareImage()">PAYLAŞ</button>
    </div>

    <div class="modal" id="search-modal">
        <div id="search-modal-content">
            <div class="search-header">
                <span id="search-pos-title">ST Aranıyor</span>
                <span style="font-size: 12px; color: #bdc3c7; cursor: pointer;" onclick="closeModal('search-modal')">✖</span>
            </div>
            <input type="text" id="searchInput" placeholder="Futbolcu ara..." autocomplete="off">
            <div class="results" id="resultsList"></div>
        </div>
    </div>

    <!-- PAYLAŞIM / İNDİRME MODALI -->
    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            <h2 style="margin:0; color:#2ecc71; font-weight:800; font-size:20px;">KADRON HAZIR!</h2>
            <img id="generated-image-preview" src="" alt="Kadro Görseli">
            
            <div class="social-grid">
                <button class="social-btn btn-download" onclick="downloadImage()">İndir ⬇️</button>
                <button class="social-btn btn-wp" onclick="shareToApps()">WhatsApp 💬</button>
                <button class="social-btn btn-ig" onclick="shareToApps()">Instagram 📸</button>
                <button class="social-btn btn-tw" onclick="shareToApps()">Twitter (X) 🐦</button>
            </div>
            
            <button class="close-btn" onclick="closeModal('result-modal')">Vazgeç</button>
        </div>
    </div>

    <script>
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let username = "";
        let generatedImageData = "";

        const dbPlayers = [
            { name: "Dani Osvaldo", pos: "ST", img: "https://cdn.sofifa.net/players/176/993/16_120.png", traits: ["serie_a_3"] },
            { name: "Mauro Icardi", pos: "ST", img: "https://cdn.sofifa.net/players/201/399/24_120.png", traits: ["gol_400", "psg"] },
            { name: "Luis Suárez", pos: "ST", img: "https://cdn.sofifa.net/players/176/580/24_120.png", traits: ["gol_400"] },
            { name: "Mohamed Salah", pos: "ST", img: "https://cdn.sofifa.net/players/209/331/24_120.png", traits: ["gol_400", "premier_lig"] },
            { name: "Dusan Tadic", pos: "LM", img: "https://cdn.sofifa.net/players/199/434/24_120.png", traits: ["eredivisie"] },
            { name: "Noa Lang", pos: "LM", img: "https://cdn.sofifa.net/players/247/802/24_120.png", traits: ["eredivisie"] },
            { name: "Mario Lemina", pos: "CM", img: "https://cdn.sofifa.net/players/212/883/24_120.png", traits: ["super_lig"] },
            { name: "Gabriel Sara", pos: "CM", img: "https://cdn.sofifa.net/players/247/204/24_120.png", traits: ["brezilya"] },
            { name: "Leroy Sané", pos: "RM", img: "https://cdn.sofifa.net/players/222/492/24_120.png", traits: ["alman"] },
            { name: "Elvis Manu", pos: "RM", img: "https://cdn.sofifa.net/players/208/093/22_120.png", traits: ["super_lig"] },
            { name: "Jordi Alba", pos: "LB", img: "https://cdn.sofifa.net/players/189/332/24_120.png", traits: ["ispanyol"] },
            { name: "Abdülkerim Bardakçı", pos: "CB", img: "https://cdn.sofifa.net/players/232/730/24_120.png", traits: ["sol_ayak"] },
            { name: "Paolo Maldini", pos: "CB", img: "https://cdn.sofifa.net/players/110/9/09_120.png", traits: ["tek_takim"] },
            { name: "Kyle Walker", pos: "RB", img: "https://cdn.sofifa.net/players/188/350/24_120.png", traits: ["ingiliz"] },
            { name: "Gregor Kobel", pos: "GK", img: "https://cdn.sofifa.net/players/234/396/24_120.png", traits: ["bundesliga"] }
        ];

        const todayGrid = {
            "slot-st-l": { pos: "ST", criteriaText: "Serie A'da 3+ takım", reqTrait: "serie_a_3" },
            "slot-st-r": { pos: "ST", criteriaText: "400+ Kariyer Golü", reqTrait: "gol_400" },
            "slot-lm": { pos: "LM", criteriaText: "Eredivisie Oynamış", reqTrait: "eredivisie" },
            "slot-cm-l": { pos: "CM", criteriaText: "Süper Lig Oynamış", reqTrait: "super_lig" },
            "slot-cm-r": { pos: "CM", criteriaText: "Brezilyalı", reqTrait: "brezilya" },
            "slot-rm": { pos: "RM", criteriaText: "Alman Oyuncu", reqTrait: "alman" },
            "slot-lb": { pos: "LB", criteriaText: "İspanyol", reqTrait: "ispanyol" },
            "slot-cb-l": { pos: "CB", criteriaText: "Sol Ayaklı Stoper", reqTrait: "sol_ayak" },
            "slot-cb-r": { pos: "CB", criteriaText: "Tek Takım Efsanesi", reqTrait: "tek_takim" },
            "slot-rb": { pos: "RB", criteriaText: "İngiliz Bek", reqTrait: "ingiliz" },
            "slot-gk": { pos: "GK", criteriaText: "Bundesliga Eldiveni", reqTrait: "bundesliga" }
        };

        function normalizeMetin(metin) {
            return metin.replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                        .replace(/Ş/g, 's').replace(/ş/g, 's')
                        .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
                        .replace(/Ü/g, 'u').replace(/ü/g, 'u')
                        .replace(/Ö/g, 'o').replace(/ö/g, 'o')
                        .replace(/Ç/g, 'c').replace(/ç/g, 'c')
                        .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) {
                alert("En az 3 harfli bir nickname gir dostum.");
                return;
            }
            username = input;
            
            // Posterin başlığını ayarlıyoruz
            document.getElementById("capture-title").innerText = `${username}'in İlk 11'i`;
            
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            
            renderPitch();
        }

        function renderPitch() {
            for (let id in todayGrid) {
                const data = todayGrid[id];
                const container = document.getElementById(id);
                container.innerHTML = `
                    <div class="slot" id="${id}-btn" onclick="openSearch('${id}')">+</div>
                    <div class="pos-badge">${data.pos}</div>
                    <div class="player-name" id="${id}-name"></div>
                    <div class="criteria">${data.criteriaText}</div>
                `;
            }
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            
            activeSlotId = slotId;
            const pos = todayGrid[slotId].pos;
            
            document.getElementById("search-pos-title").innerText = pos + " ARANIYOR";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeMetin(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            const targetPos = todayGrid[activeSlotId].pos;
            const filtered = dbPlayers.filter(p => 
                p.pos === targetPos && normalizeMetin(p.name).includes(val)
            );

            filtered.forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}" alt="face"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqTrait = todayGrid[activeSlotId].reqTrait;
            const inputField = document.getElementById("searchInput");

            if (player.traits.includes(reqTrait)) {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${player.img})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        function generateShareImage() {
            const captureArea = document.getElementById("capture-area");
            const shareBtn = document.getElementById("final-share-btn");
            shareBtn.innerText = "HAZIRLANIYOR...";
            
            html2canvas(captureArea, {
                backgroundColor: "#020604",
                scale: 2
            }).then(canvas => {
                generatedImageData = canvas.toDataURL("image/jpeg", 0.9);
                document.getElementById("generated-image-preview").src = generatedImageData;
                
                document.getElementById("result-modal").style.display = "flex";
                shareBtn.innerText = "PAYLAŞ";
            });
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `Grid11_${username}.jpg`;
            link.href = generatedImageData;
            link.click();
        }

        async function shareToApps() {
            if (!navigator.share) {
                alert("Tarayıcın desteklemiyor reis. Önce 'İndir' butonuna basıp galerinden atabilirsin.");
                return;
            }
            try {
                const blob = await (await fetch(generatedImageData)).blob();
                const file = new File([blob], 'grid11.jpg', { type: 'image/jpeg' });

                await navigator.share({
                    title: 'Grid 11 Kadrom',
                    text: `Bugünkü Grid 11'i ${score} skorla bitirdim!`,
                    files: [file]
                });
            } catch (error) {
                console.log("Paylaşım iptal edildi.", error);
            }
        }
    </script>
</body>
</html>
