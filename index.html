        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function generateDailyGrid() {
            const today = new Date();
            const dateString = today.getFullYear() + "" + today.getMonth() + "" + today.getDate();
            const rnd = mulberry32(parseInt(dateString));

            const formKeys = Object.keys(dizilisler);
            const selKey = formKeys[Math.floor(rnd() * formKeys.length)];
            dailyFormationLayout = dizilisler[selKey];

            const usedTraits = new Set();
            let slotIndex = 0;
            todayGrid = {};

            dailyFormationLayout.forEach(rowArr => {
                rowArr.forEach(pos => {
                    let pool = [];
                    if(pos === 'GK') pool = kriterler.GK;
                    else if(['LB','RB'].includes(pos)) pool = kriterler.FB;
                    else if(pos === 'CB') pool = kriterler.CB;
                    else if(pos === 'CM') pool = kriterler.CM;
                    else if(['LM','RM'].includes(pos)) pool = kriterler.WING;
                    else if(pos === 'ST') pool = kriterler.ST;

                    let selectedCriterion = null;
                    let attempts = 0;
                    
                    while(attempts < 200) {
                        const useGeneral = (rnd() > 0.4); 
                        const currentPool = (useGeneral || pool.length === 0) ? kriterler.GENEL : pool;
                        
                        selectedCriterion = currentPool[Math.floor(rnd() * currentPool.length)];
                        
                        if(!usedTraits.has(selectedCriterion.trait)) {
                            usedTraits.add(selectedCriterion.trait);
                            break;
                        }
                        attempts++;
                    }

                    todayGrid[`slot-${slotIndex}`] = {
                        pos: pos,
                        criteriaText: selectedCriterion.text,
                        reqTrait: selectedCriterion.trait
                    };
                    slotIndex++;
                });
            });
        }

        window.onload = () => {
            generateDailyGrid();

        };

        function normalizeMetin(metin) {
            return metin.replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                        .replace(/Ş/g, 's').replace(/ş/g, 's')
                        .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
                        .replace(/Ü/g, 'u').replace(/ü/g, 'u')
                        .replace(/Ö/g, 'o').replace(/ö/g, 'o')
                        .replace(/Ç/g, 'c').replace(/ç/g, 'c')
                        .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) {
                alert("En az 3 harfli bir nickname gir.");
                return;
            }
            username = input;
            
            localStorage.setItem("grid11_username", username);
            
            document.getElementById("display-nickname").innerText = username;
            
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            
            renderPitch();
        }

        function renderPitch() {
            const pitch = document.getElementById("pitch");
            pitch.innerHTML = "";
            let slotIndex = 0;

            dailyFormationLayout.forEach(rowArr => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                
                rowArr.forEach(pos => {
                    const slotId = `slot-${slotIndex}`;
                    const data = todayGrid[slotId];
                    
                    rowDiv.innerHTML += `
                        <div class="slot-container" id="${slotId}-container">
                            <div class="slot" id="${slotId}-btn" onclick="openSearch('${slotId}')">+</div>
                            <div class="pos-badge">${data.pos}</div>
                            <div class="player-name" id="${slotId}-name"></div>
                            <div class="criteria">${data.criteriaText}</div>
                        </div>
                    `;
                    slotIndex++;
                });
                pitch.appendChild(rowDiv);
            });
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            
            activeSlotId = slotId;
            const pos = todayGrid[slotId].pos;
            
            document.getElementById("search-pos-title").innerText = pos + " ARANIYOR";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove("show");
            
            if(modalId === 'result-modal') {
                setTimeout(() => { modal.style.display = "none"; }, 400);
            } else {
                modal.style.display = "none";
            }
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeMetin(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            const targetPos = todayGrid[activeSlotId].pos;
            
            const filtered = dbPlayers.filter(p => {
                return normalizeMetin(p.name).includes(val);
            });

            filtered.forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}" alt="face"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqTrait = todayGrid[activeSlotId].reqTrait;
            const inputField = document.getElementById("searchInput");

            if (player.traits.includes(reqTrait)) {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${player.img})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "inline-block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        function showShareScreen() {
            const flash = document.getElementById("flash-effect");
            flash.classList.add("flash-active");
            
            setTimeout(() => {
                flash.classList.remove("flash-active");
            }, 80);

            document.getElementById("ss-title").innerText = `${username}'in İlk 11'i`;
            document.getElementById("ss-score").innerText = `Skor: ${score}`;
            
            const originalPitch = document.getElementById("pitch");
            document.getElementById("ss-pitch-container").innerHTML = originalPitch.innerHTML;
            
            const modal = document.getElementById("result-modal");
            modal.style.display = "flex";
            
            setTimeout(() => {
                modal.classList.add("show");
            }, 50);
        }
    </script>
</body>
</html>
