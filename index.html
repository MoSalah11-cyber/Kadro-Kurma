<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- GİRİŞ EKRANI --- */
        #login-screen {
            text-align: center;
            background: rgba(15, 45, 25, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }

        #login-screen h1 {
            font-weight: 800;
            margin-top: 0;
            color: #2ecc71;
            letter-spacing: 2px;
            font-size: 32px;
        }

        #nickname-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus { border-color: #2ecc71; }

        .play-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            text-transform: uppercase;
        }

        .play-btn:hover { background: #2ecc71; transform: translateY(-2px); }

        /* --- ANA OYUN EKRANI --- */
        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .user-info {
            font-size: 16px;
            color: #2ecc71;
            font-weight: 800;
            text-transform: uppercase;
        }

        .score-box {
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 800;
            color: #f1c40f;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        .pitch {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px 10px;
        }

        .row {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 20px;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            text-align: center;
        }

        .slot {
            width: 60px;
            height: 85px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            background-size: cover;
            background-position: center top;
            font-size: 24px;
            color: rgba(255,255,255,0.3);
        }

        .slot.filled {
            border: 2px solid #2ecc71;
            color: transparent; 
        }

        .pos-badge {
            background: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: -10px;
            z-index: 2;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .criteria {
            font-size: 9px;
            margin-top: 6px;
            color: #bdc3c7;
            font-weight: 600;
            line-height: 1.1;
            padding: 2px;
        }

        .player-name {
            font-size: 10px;
            font-weight: 800;
            margin-top: 5px;
            color: #fff;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* FİNAL PAYLAŞ BUTONU */
        #final-share-btn {
            display: none;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #final-share-btn:hover {
            background: #2ecc71;
            color: #fff;
        }

        /* --- MODALLAR --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #search-modal-content {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #2ecc71;
            font-weight: 800;
        }

        /* YENİ JİLET GİBİ SS (EKRAN GÖRÜNTÜSÜ) ÇERÇEVESİ */
        #result-modal-content {
            background: transparent;
            padding: 0;
            border: none;
            width: 92%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #ss-card {
            background: linear-gradient(135deg, #0a1f12 0%, #020604 100%);
            border: 3px solid #2ecc71;
            border-radius: 16px;
            padding: 25px 10px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            pointer-events: none; /* SS alırken yanlışlıkla tıklanmasın diye */
        }

        #ss-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(46, 204, 113, 0.3);
        }

        #ss-title {
            margin: 0;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #ss-score {
            display: inline-block;
            margin-top: 10px;
            background: #f1c40f;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            color: #000;
            font-size: 14px;
        }

        .ss-info {
            color: #bdc3c7;
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* ORTAK ARAMA STİLLERİ */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            background: rgba(0,0,0,0.4);
            color: #fff;
        }

        input[type="text"]:focus { border-color: #2ecc71; }
        input[type="text"].error { border-color: #e74c3c; animation: shake 0.4s; }

        .results {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .player-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .player-item img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        .close-btn {
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            background: #e74c3c;
            color: #fff;
            font-family: inherit;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>GRID 11</h1>
        <input type="text" id="nickname-input" placeholder="Nickname girin..." autocomplete="off">
        <button class="play-btn" onclick="startGame()">OYNA</button>
    </div>

    <div id="game-container">
        
        <div class="header">
            <div class="user-info" id="display-nickname">---</div>
            <div class="score-box">Skor: <span id="scoreVal">0</span></div>
        </div>

        <div class="pitch" id="pitch">
            <div class="row">
                <div class="slot-container" id="slot-st-l"></div>
                <div class="slot-container" id="slot-st-r"></div>
            </div>
            <div class="row">
                <div class="slot-container" id="slot-lm"></div>
                <div class="slot-container" id="slot-cm-l"></div>
                <div class="slot-container" id="slot-cm-r"></div>
                <div class="slot-container" id="slot-rm"></div>
            </div>
            <div class="row">
                <div class="slot-container" id="slot-lb"></div>
                <div class="slot-container" id="slot-cb-l"></div>
                <div class="slot-container" id="slot-cb-r"></div>
                <div class="slot-container" id="slot-rb"></div>
            </div>
            <div class="row">
                <div class="slot-container" id="slot-gk"></div>
            </div>
        </div>

        <button id="final-share-btn" onclick="showShareScreen()">PAYLAŞ 📸</button>
    </div>

    <!-- ARAMA MODALI -->
    <div class="modal" id="search-modal">
        <div id="search-modal-content">
            <div class="search-header">
                <span id="search-pos-title">ST Aranıyor</span>
                <span style="font-size: 12px; color: #bdc3c7; cursor: pointer;" onclick="closeModal('search-modal')">✖</span>
            </div>
            <input type="text" id="searchInput" placeholder="Futbolcu ara..." autocomplete="off">
            <div class="results" id="resultsList"></div>
        </div>
    </div>

    <!-- YENİ SS (EKRAN GÖRÜNTÜSÜ) MODALI -->
    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            
            <!-- Screenshot Alınacak Jilet Çerçeve -->
            <div id="ss-card">
                <div id="ss-header">
                    <h2 id="ss-title">---'in İlk 11'i</h2>
                    <div id="ss-score">Skor: 0</div>
                </div>
                <!-- Sahanın Kopyası Buraya Gelecek -->
                <div id="ss-pitch-container"></div>
            </div>

            <div class="ss-info">Çerçevenin Ekran Görüntüsünü (SS) Alabilirsin!</div>
            <button class="close-btn" onclick="closeModal('result-modal')">KAPAT</button>
            
        </div>
    </div>

    <script>
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let username = "";

        const dbPlayers = [
            { name: "Dani Osvaldo", pos: "ST", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/176/993/16_120.png", traits: ["serie_a_3"] },
            { name: "Mauro Icardi", pos: "ST", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/201/399/24_120.png", traits: ["gol_400", "psg"] },
            { name: "Noa Lang", pos: "LM", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/247/802/24_120.png", traits: ["eredivisie"] },
            { name: "Mario Lemina", pos: "CM", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/212/883/24_120.png", traits: ["super_lig"] },
            { name: "Gabriel Sara", pos: "CM", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/247/204/24_120.png", traits: ["brezilya"] },
            { name: "Leroy Sané", pos: "RM", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/222/492/24_120.png", traits: ["alman"] },
            { name: "Jordi Alba", pos: "LB", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/189/332/24_120.png", traits: ["ispanyol"] },
            { name: "Abdülkerim Bardakçı", pos: "CB", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/232/730/24_120.png", traits: ["sol_ayak"] },
            { name: "Paolo Maldini", pos: "CB", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/110/9/09_120.png", traits: ["tek_takim"] },
            { name: "Kyle Walker", pos: "RB", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/188/350/24_120.png", traits: ["ingiliz"] },
            { name: "Gregor Kobel", pos: "GK", img: "https://api.allorigins.win/raw?url=https://cdn.sofifa.net/players/234/396/24_120.png", traits: ["bundesliga"] }
        ];

        const todayGrid = {
            "slot-st-l": { pos: "ST", criteriaText: "Serie A'da 3+ takım", reqTrait: "serie_a_3" },
            "slot-st-r": { pos: "ST", criteriaText: "400+ Kariyer Golü", reqTrait: "gol_400" },
            "slot-lm": { pos: "LM", criteriaText: "Eredivisie Oynamış", reqTrait: "eredivisie" },
            "slot-cm-l": { pos: "CM", criteriaText: "Süper Lig Oynamış", reqTrait: "super_lig" },
            "slot-cm-r": { pos: "CM", criteriaText: "Brezilyalı", reqTrait: "brezilya" },
            "slot-rm": { pos: "RM", criteriaText: "Alman Oyuncu", reqTrait: "alman" },
            "slot-lb": { pos: "LB", criteriaText: "İspanyol", reqTrait: "ispanyol" },
            "slot-cb-l": { pos: "CB", criteriaText: "Sol Ayaklı Stoper", reqTrait: "sol_ayak" },
            "slot-cb-r": { pos: "CB", criteriaText: "Tek Takım Efsanesi", reqTrait: "tek_takim" },
            "slot-rb": { pos: "RB", criteriaText: "İngiliz Bek", reqTrait: "ingiliz" },
            "slot-gk": { pos: "GK", criteriaText: "Bundesliga Eldiveni", reqTrait: "bundesliga" }
        };

        function normalizeMetin(metin) {
            return metin.replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                        .replace(/Ş/g, 's').replace(/ş/g, 's')
                        .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
                        .replace(/Ü/g, 'u').replace(/ü/g, 'u')
                        .replace(/Ö/g, 'o').replace(/ö/g, 'o')
                        .replace(/Ç/g, 'c').replace(/ç/g, 'c')
                        .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) {
                alert("En az 3 harfli bir nickname gir.");
                return;
            }
            username = input;
            
            document.getElementById("display-nickname").innerText = username;
            
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            
            renderPitch();
        }

        function renderPitch() {
            for (let id in todayGrid) {
                const data = todayGrid[id];
                const container = document.getElementById(id);
                container.innerHTML = `
                    <div class="slot" id="${id}-btn" onclick="openSearch('${id}')">+</div>
                    <div class="pos-badge">${data.pos}</div>
                    <div class="player-name" id="${id}-name"></div>
                    <div class="criteria">${data.criteriaText}</div>
                `;
            }
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            
            activeSlotId = slotId;
            const pos = todayGrid[slotId].pos;
            
            document.getElementById("search-pos-title").innerText = pos + " ARANIYOR";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeMetin(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            const targetPos = todayGrid[activeSlotId].pos;
            const filtered = dbPlayers.filter(p => 
                p.pos === targetPos && normalizeMetin(p.name).includes(val)
            );

            filtered.forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}" alt="face"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqTrait = todayGrid[activeSlotId].reqTrait;
            const inputField = document.getElementById("searchInput");

            if (player.traits.includes(reqTrait)) {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${player.img})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "inline-block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        // KÜTÜPHANELERE İHTİYAÇ DUYMAYAN, EKRAN GÖRÜNTÜSÜ ALINMALIK ÇERÇEVEYİ AÇAN FONKSİYON
        function showShareScreen() {
            // İsim ve skoru karta yazdır
            document.getElementById("ss-title").innerText = `${username}'in İlk 11'i`;
            document.getElementById("ss-score").innerText = `Skor: ${score}`;
            
            // Sahadaki dizilişin (resimlerin) birebir aynısını kopyalayıp SS kartının içine yapıştır
            const originalPitch = document.getElementById("pitch");
            document.getElementById("ss-pitch-container").innerHTML = originalPitch.innerHTML;
            
            // Çerçeve menüsünü aç
            document.getElementById("result-modal").style.display = "flex";
        }
    </script>
</body>
</html>
