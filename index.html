<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- GİRİŞ EKRANI --- */
        #login-screen {
            text-align: center;
            background: rgba(15, 45, 25, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }

        #login-screen h1 {
            font-weight: 800;
            margin-top: 0;
            color: #2ecc71;
            letter-spacing: 2px;
            font-size: 32px;
        }

        #nickname-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus { border-color: #2ecc71; }

        .play-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .play-btn:hover { background: #2ecc71; transform: translateY(-2px); }

        /* --- ANA OYUN EKRANI --- */
        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Ekran Görüntüsü Alınacak Alan (Capture Area) */
        #capture-area {
            padding: 15px;
            border-radius: 16px;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%); /* İndirilen fotoda arka plan siyah olmasın diye */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            font-size: 14px;
            color: #bdc3c7;
        }
        
        .user-info span { color: #2ecc71; font-weight: 600; font-size: 18px;}

        .score-box {
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Cam Efektli Saha */
        .pitch {
            background: rgba(15, 45, 25, 0.8); /* Screenshot için biraz daha opak yaptık */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .row {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 25px;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            text-align: center;
        }

        .slot {
            width: 65px;
            height: 95px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            background-size: cover;
            background-position: center top;
            font-size: 24px;
            color: rgba(255,255,255,0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .slot:hover {
            transform: translateY(-5px);
            border-color: #2ecc71;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .slot.filled {
            border: 2px solid #f1c40f;
            color: transparent; 
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
        }

        .pos-badge {
            background: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: -12px;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.2);
            color: #2ecc71;
        }

        .criteria {
            font-size: 10px;
            margin-top: 8px;
            color: #bdc3c7;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .criteria:hover {
            color: #fff;
            background: rgba(46, 204, 113, 0.15);
            border-color: rgba(46, 204, 113, 0.3);
        }

        .player-name {
            font-size: 11px;
            font-weight: 800;
            margin-top: 5px;
            color: #f1c40f;
            display: none;
        }

        /* FİNAL PAYLAŞ BUTONU */
        #final-share-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #final-share-btn:hover {
            background: #2ecc71;
            transform: scale(1.02);
        }

        /* --- MODAL GENEL AYARLARI --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 10;
            perspective: 1000px;
        }

        /* ARAMA MODALI */
        #search-modal-content {
            background: #1a251e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #2ecc71;
            font-weight: 800;
        }

        /* 3D KART EFEKTLİ KRİTER MODALI */
        #card-modal-content {
            background: linear-gradient(135deg, #1e3c28 0%, #0a1f12 100%);
            padding: 40px 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 300px;
            border: 1px solid #2ecc71;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            transform: rotateY(90deg) scale(0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.show #card-modal-content {
            transform: rotateY(0deg) scale(1);
            opacity: 1;
        }

        .modal-pos {
            font-size: 16px;
            color: #2ecc71;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .modal-criteria {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* PAYLAŞIM SONUÇ MODALI */
        #result-modal-content {
            background: #1a251e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #generated-image-preview {
            width: 100%;
            border-radius: 8px;
            border: 2px solid #2ecc71;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            color: #fff;
            transition: 0.2s;
        }

        .btn-download { background: #f39c12; }
        .btn-download:hover { background: #f1c40f; }

        .btn-social { background: #3498db; }
        .btn-social:hover { background: #2980b9; }

        /* ORTAK ARAMA VE BUTON STİLLERİ */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            background: rgba(0,0,0,0.4);
            color: #fff;
            transition: 0.2s;
        }

        input[type="text"]:focus { border-color: #2ecc71; }
        input[type="text"].error { border-color: #e74c3c; animation: shake 0.4s; }

        .results {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .player-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .player-item:hover {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
        }

        .player-item img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        .close-btn {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #e74c3c;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid #e74c3c;
            transition: 0.2s;
        }
        
        .close-btn:hover { background: #e74c3c; color: #fff; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>GRID 11</h1>
        <p style="color: #bdc3c7; font-size: 14px; margin-bottom: 25px;">Futbol hafızanı test et.</p>
        <input type="text" id="nickname-input" placeholder="Nickname girin..." autocomplete="off">
        <button class="play-btn" onclick="startGame()">Günün Gridini Oyna</button>
    </div>

    <div id="game-container">
        
        <div id="capture-area">
            <div class="header">
                <div class="user-info"><span id="display-nickname">---</span>'in İlk 11'i</div>
                <div class="score-box">Skor: <span id="scoreVal" style="color: #f1c40f;">0</span></div>
            </div>

            <div class="pitch" id="pitch">
                <div class="row">
                    <div class="slot-container" id="slot-st-l"></div>
                    <div class="slot-container" id="slot-st-r"></div>
                </div>
                <div class="row">
                    <div class="slot-container" id="slot-lm"></div>
                    <div class="slot-container" id="slot-cm-l"></div>
                    <div class="slot-container" id="slot-cm-r"></div>
                    <div class="slot-container" id="slot-rm"></div>
                </div>
                <div class="row">
                    <div class="slot-container" id="slot-lb"></div>
                    <div class="slot-container" id="slot-cb-l"></div>
                    <div class="slot-container" id="slot-cb-r"></div>
                    <div class="slot-container" id="slot-rb"></div>
                </div>
                <div class="row">
                    <div class="slot-container" id="slot-gk"></div>
                </div>
            </div>
        </div>

        <button id="final-share-btn" onclick="generateShareImage()">📤 PAYLAŞ</button>
    </div>

    <div class="modal" id="search-modal">
        <div id="search-modal-content">
            <div class="search-header">
                <span id="search-pos-title">ST Aranıyor</span>
                <span style="font-size: 12px; color: #bdc3c7; cursor: pointer;" onclick="closeModal('search-modal')">✖</span>
            </div>
            <input type="text" id="searchInput" placeholder="Futbolcu ara..." autocomplete="off">
            <div class="results" id="resultsList"></div>
        </div>
    </div>

    <div class="modal" id="card-modal">
        <div id="card-modal-content">
            <div class="modal-pos" id="card-pos">MEVKİ</div>
            <div class="modal-criteria" id="card-title">Kriter Burada Yazacak</div>
            <button class="play-btn" onclick="switchFromCardToSearch()">Oyuncu Ara</button>
            <button class="close-btn" onclick="closeModal('card-modal')">Kapat</button>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            <h2 style="margin:0; color:#2ecc71; font-weight:800;">EFSANE KADRO!</h2>
            <p style="margin:0; font-size:12px; color:#bdc3c7;">Görselin hazır, arkadaşlarına hava atma vakti.</p>
            
            <img id="generated-image-preview" src="" alt="Kadro Görseli">
            
            <div class="action-btns">
                <button class="btn-download" onclick="downloadImage()">⬇️ Resmi İndir</button>
                <button class="btn-social" onclick="shareToApps()">📤 Uygulamalarda Paylaş</button>
            </div>
            <button class="close-btn" style="margin-top: 5px;" onclick="closeModal('result-modal')">Kapat</button>
        </div>
    </div>

    <script>
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let username = "";
        let generatedImageData = ""; // Ekran görüntüsünü burada tutacağız

        // HER MEVKİ İÇİN FULL TEST VERİTABANI
        const dbPlayers = [
            { name: "Dani Osvaldo", pos: "ST", img: "https://cdn.sofifa.net/players/176/993/16_120.png", traits: ["serie_a_3"] },
            { name: "Luis Suárez", pos: "ST", img: "https://cdn.sofifa.net/players/176/580/24_120.png", traits: ["gol_400"] },
            { name: "Dusan Tadic", pos: "LM", img: "https://cdn.sofifa.net/players/199/434/24_120.png", traits: ["eredivisie"] },
            { name: "Mario Lemina", pos: "CM", img: "https://cdn.sofifa.net/players/212/883/24_120.png", traits: ["super_lig"] },
            { name: "Gabriel Sara", pos: "CM", img: "https://cdn.sofifa.net/players/247/204/24_120.png", traits: ["brezilya"] },
            { name: "Leroy Sané", pos: "RM", img: "https://cdn.sofifa.net/players/222/492/24_120.png", traits: ["alman"] },
            { name: "Jordi Alba", pos: "LB", img: "https://cdn.sofifa.net/players/189/332/24_120.png", traits: ["ispanyol"] },
            { name: "Abdülkerim Bardakçı", pos: "CB", img: "https://cdn.sofifa.net/players/232/730/24_120.png", traits: ["sol_ayak"] },
            { name: "Paolo Maldini", pos: "CB", img: "https://cdn.sofifa.net/players/110/9/09_120.png", traits: ["tek_takim"] },
            { name: "Kyle Walker", pos: "RB", img: "https://cdn.sofifa.net/players/188/350/24_120.png", traits: ["ingiliz"] },
            { name: "Gregor Kobel", pos: "GK", img: "https://cdn.sofifa.net/players/234/396/24_120.png", traits: ["bundesliga"] }
        ];

        const todayGrid = {
            "slot-st-l": { pos: "ST", criteriaText: "Serie A'da 3+ takım", reqTrait: "serie_a_3" },
            "slot-st-r": { pos: "ST", criteriaText: "400+ Kariyer Golü", reqTrait: "gol_400" },
            "slot-lm": { pos: "LM", criteriaText: "Eredivisie Oynamış", reqTrait: "eredivisie" },
            "slot-cm-l": { pos: "CM", criteriaText: "Süper Lig Oynamış", reqTrait: "super_lig" },
            "slot-cm-r": { pos: "CM", criteriaText: "Brezilyalı", reqTrait: "brezilya" },
            "slot-rm": { pos: "RM", criteriaText: "Alman Oyuncu", reqTrait: "alman" },
            "slot-lb": { pos: "LB", criteriaText: "İspanyol", reqTrait: "ispanyol" },
            "slot-cb-l": { pos: "CB", criteriaText: "Sol Ayaklı Stoper", reqTrait: "sol_ayak" },
            "slot-cb-r": { pos: "CB", criteriaText: "Tek Takım Efsanesi", reqTrait: "tek_takim" },
            "slot-rb": { pos: "RB", criteriaText: "İngiliz Bek", reqTrait: "ingiliz" },
            "slot-gk": { pos: "GK", criteriaText: "Bundesliga Eldiveni", reqTrait: "bundesliga" }
        };

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) {
                alert("En az 3 harfli bir nickname gir dostum.");
                return;
            }
            username = input;
            document.getElementById("display-nickname").innerText = username;
            
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            
            renderPitch();
        }

        function renderPitch() {
            for (let id in todayGrid) {
                const data = todayGrid[id];
                const container = document.getElementById(id);
                container.innerHTML = `
                    <div class="slot" id="${id}-btn" onclick="openSearch('${id}')">+</div>
                    <div class="pos-badge">${data.pos}</div>
                    <div class="player-name" id="${id}-name"></div>
                    <div class="criteria" onclick="openCard('${id}')" title="Kriteri Büyüt">${data.criteriaText}</div>
                `;
            }
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            
            activeSlotId = slotId;
            const pos = todayGrid[slotId].pos;
            
            document.getElementById("search-pos-title").innerText = pos + " ARANIYOR";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function openCard(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            
            activeSlotId = slotId;
            const data = todayGrid[slotId];
            
            document.getElementById("card-pos").innerText = data.pos + " ARANIYOR";
            document.getElementById("card-title").innerText = data.criteriaText;
            
            const modal = document.getElementById("card-modal");
            modal.style.display = "flex";
            
            setTimeout(() => { modal.classList.add("show"); }, 10);
        }

        function switchFromCardToSearch() {
            closeModal('card-modal');
            setTimeout(() => { openSearch(activeSlotId); }, 300);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove("show");
            if(modalId === 'card-modal') {
                setTimeout(() => { modal.style.display = "none"; }, 300);
            } else {
                modal.style.display = "none";
            }
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = e.target.value.toLowerCase();
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            const targetPos = todayGrid[activeSlotId].pos;
            const filtered = dbPlayers.filter(p => 
                p.pos === targetPos && p.name.toLowerCase().includes(val)
            );

            filtered.forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}" alt="face"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqTrait = todayGrid[activeSlotId].reqTrait;
            const inputField = document.getElementById("searchInput");

            if (player.traits.includes(reqTrait)) {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${player.img})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "block";
                
                filledCount++;
                closeModal('search-modal');

                // OYUN BİTTİĞİNDE PAYLAŞ BUTONUNU GÖSTER
                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        // FOTOĞRAF OLUŞTURMA FONKSİYONU
        function generateShareImage() {
            const captureArea = document.getElementById("capture-area");
            const shareBtn = document.getElementById("final-share-btn");
            shareBtn.innerText = "Görsel Hazırlanıyor... ⏳";
            
            html2canvas(captureArea, {
                backgroundColor: "#0a1f12", // Arkası transparan kalmasın diye tam rengi veriyoruz
                scale: 2 // Görüntü kalitesini artırmak için
            }).then(canvas => {
                generatedImageData = canvas.toDataURL("image/jpeg", 0.9);
                document.getElementById("generated-image-preview").src = generatedImageData;
                
                document.getElementById("result-modal").style.display = "flex";
                shareBtn.innerText = "📤 PAYLAŞ";
            });
        }

        // GALERİYE İNDİRME
        function downloadImage() {
            const link = document.createElement('a');
            link.download = `Grid11_${username}_Skor${score}.jpg`;
            link.href = generatedImageData;
            link.click();
        }

        // UYGULAMALARDA (WP/IG/X) PAYLAŞMA API'Sİ
        async function shareToApps() {
            if (!navigator.share) {
                alert("Tarayıcın direkt paylaşımı desteklemiyor reis. 'Resmi İndir' butonunu kullanıp galerinden Twitter/WhatsApp'a atabilirsin.");
                return;
            }

            try {
                // Base64 veriyi gerçek bir dosyaya(File) çeviriyoruz ki WP/IG kabul etsin
                const blob = await (await fetch(generatedImageData)).blob();
                const file = new File([blob], 'grid11.jpg', { type: 'image/jpeg' });

                await navigator.share({
                    title: 'Grid 11 Kadrom!',
                    text: `Bugünkü Grid 11'i ${score} denemede bitirdim! Hadi sen de oyna.`,
                    files: [file]
                });
            } catch (error) {
                console.log("Paylaşım iptal edildi veya hata oluştu.", error);
            }
        }
    </script>
</body>
</html>
