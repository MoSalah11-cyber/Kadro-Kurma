<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #login-screen {
            text-align: center;
            background: rgba(15, 45, 25, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }

        #login-screen h1 {
            font-weight: 800;
            margin-top: 0;
            color: #2ecc71;
            letter-spacing: 2px;
            font-size: 32px;
        }

        #loading-text {
            color: #f1c40f;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        #nickname-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus {
            border-color: #2ecc71;
        }

        .play-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .play-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        .play-btn:hover:not(:disabled) {
            background: #2ecc71;
            transform: translateY(-2px);
        }

        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        #capture-area {
            padding: 25px 15px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0a1f12 0%, #020604 100%);
            border: 3px solid #2ecc71;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .capture-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(46, 204, 113, 0.3);
        }

        .capture-header h2 {
            margin: 0;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .score-badge {
            display: inline-block;
            margin-top: 10px;
            background: #f1c40f;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            color: #000;
            font-size: 14px;
        }

        .pitch {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 10px 5px;
        }

        .row {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 20px;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            text-align: center;
        }

        .slot {
            width: 60px;
            height: 85px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-size: cover;
            background-position: center top;
            font-size: 24px;
            color: rgba(255,255,255,0.3);
        }

        .slot.filled {
            border: 2px solid #2ecc71;
            color: transparent;
        }

        .pos-badge {
            background: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: -10px;
            z-index: 2;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .criteria {
            font-size: 9px;
            margin-top: 6px;
            color: #bdc3c7;
            font-weight: 600;
            line-height: 1.1;
            padding: 2px;
        }

        .player-name {
            font-size: 10px;
            font-weight: 800;
            margin-top: 5px;
            color: #fff;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 2px 4px;
            border-radius: 4px;
        }

        #final-share-btn {
            display: none;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        #final-share-btn:hover {
            background: #2ecc71;
            color: #fff;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #search-modal-content, #result-modal-content {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #2ecc71;
            font-weight: 800;
        }

        #generated-image-preview {
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #2ecc71;
            margin-bottom: 20px;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .social-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
        }

        .btn-download { background: #34495e; grid-column: span 2; font-size: 16px;}
        .btn-tw { background: #000; border: 1px solid #333; }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-wp { background: #25D366; grid-column: span 2;}

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            outline: none;
        }

        input[type="text"].error {
            border-color: #e74c3c;
            animation: shake 0.4s;
        }

        .results {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .player-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .player-item img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        .close-btn {
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #bdc3c7;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: 800;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>GRID 11</h1>
        <div id="loading-text">Veritabanı Hazırlanıyor... Lütfen Bekle (1/3)</div>
        <input type="text" id="nickname-input" placeholder="Nickname girin..." autocomplete="off">
        <button class="play-btn" id="start-btn" onclick="startGame()" disabled>OYNA</button>
    </div>

    <div id="game-container">
        <div id="capture-area">
            <div class="capture-header">
                <h2 id="capture-title">---'in İlk 11'i</h2>
                <div class="score-badge">Skor: <span id="scoreVal">0</span></div>
            </div>
            <div class="pitch" id="pitch"></div>
        </div>
        <button id="final-share-btn" onclick="generateShareImage()">PAYLAŞ</button>
    </div>

    <div class="modal" id="search-modal">
        <div id="search-modal-content">
            <div class="search-header">
                <span id="search-pos-title">Oyuncu Aranıyor</span>
                <span style="font-size: 16px; color: #e74c3c; cursor: pointer; padding: 0 10px;" onclick="closeModal('search-modal')">X</span>
            </div>
            <input type="text" id="searchInput" placeholder="Futbolcu ara..." autocomplete="off">
            <div class="results" id="resultsList"></div>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            <img id="generated-image-preview" src="">
            <div class="social-grid">
                <button class="social-btn btn-tw" onclick="shareToApps()">Twitter</button>
                <button class="social-btn btn-ig" onclick="shareToApps()">Instagram</button>
                <button class="social-btn btn-wp" onclick="shareToApps()">WhatsApp</button>
                <button class="social-btn btn-download" onclick="downloadImage()">Resmi İndir</button>
            </div>
            <button class="close-btn" onclick="closeModal('result-modal')">Kapat</button>
        </div>
    </div>

    <script>
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let username = "";
        let generatedImageData = "";
        let dbPlayers = []; 
        let todayGrid = {};
        let dailyFormationLayout = [];

        // SENİN İÇİN MEVKİLERE ÖZEL KATEGORİLERİ GERİ GETİRDİM
        // Kaleciye gol sormasın, forvete kırmızı kart sormasın diye ayrı ayrı listeler.
        const kriterler = {
            gk: [
                { text: "190cm'den Kısa Boylu", check: p => p.hgt > 0 && p.hgt < 190 },
                { text: "3+ Kariyer Golü", check: p => p.g >= 3 },
                { text: "Kariyer Boyu Tek Takım", check: p => p.teams === 1 }
            ],
            def: [ // CB, LB, RB için (Kırmızı Kartlar ve Boy)
                { text: "5+ Kırmızı Kart", check: p => p.r >= 5 },
                { text: "7+ Kırmızı Kart", check: p => p.r >= 7 },
                { text: "190cm'den Uzun Boylu", check: p => p.hgt > 190 }
            ],
            mid: [ // CM, RM, LM için
                { text: "100+ Asist", check: p => p.a >= 100 },
                { text: "200+ Asist", check: p => p.a >= 200 }
            ],
            att: [ // ST, RW, LW için (Goller)
                { text: "200+ Kariyer Golü", check: p => p.g >= 200 },
                { text: "400+ Kariyer Golü", check: p => p.g >= 400 }
            ],
            genel: [ // Herkes için geçerli olabilecek ortak şeyler
                { text: "Süper Lig'de Oynamış", check: p => p.comps.includes("TR1") },
                { text: "Premier Lig'de Oynamış", check: p => p.comps.includes("GB1") },
                { text: "Serie A'da Oynamış", check: p => p.comps.includes("IT1") },
                { text: "Brezilyalı", check: p => p.nat.includes("brazil") },
                { text: "Türk", check: p => p.nat.includes("turkey") || p.nat.includes("türkiye") },
                { text: "Arjantinli", check: p => p.nat.includes("argentina") },
                { text: "Alman", check: p => p.nat.includes("germany") },
                { text: "8+ Farklı Takımda Oynamış", check: p => p.teams >= 8 },
                { text: "23 Yaş ve Altı", check: p => p.age <= 23 && p.age > 0 },
                { text: "33 Yaş ve Üstü", check: p => p.age >= 33 },
                { text: "Piyasa Değeri 50M+ Euro", check: p => p.mv >= 50000000 }
            ]
        };

        const dizilisler = {
            "442": [["ST", "ST"], ["RM", "CM", "CM", "RM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "433": [["RM", "ST", "RM"], ["CM", "CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "4231": [["ST"], ["RM", "CM", "RM"], ["CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"]]
        };

        // GÜNLÜK RASTGELE SAYI ÜRETİCİ
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // CSV OKUMA
        function parseCSV(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: results => resolve(results.data),
                    error: err => reject(err)
                });
            });
        }

        // VERİTABANI YÜKLEME VE BİRLEŞTİRME SİSTEMİ
        async function loadAllDatabases() {
            const statusEl = document.getElementById("loading-text");
            try {
                statusEl.innerText = "İstatistikler Çekiliyor... (1/3)";
                const appsData = await parseCSV('appearances.csv');
                const appsMap = new Map();
                for (let i = 0; i < appsData.length; i++) {
                    let row = appsData[i];
                    let pid = row.player_id;
                    if (!appsMap.has(pid)) appsMap.set(pid, {g:0, a:0, r:0, comps: new Set()});
                    let p = appsMap.get(pid);
                    p.g += parseInt(row.goals || 0);
                    p.a += parseInt(row.assists || 0);
                    p.r += parseInt(row.red_cards || 0);
                    if (row.competition_id) p.comps.add(row.competition_id);
                }
                appsData.length = 0; 

                statusEl.innerText = "Transferler Çekiliyor... (2/3)";
                const transData = await parseCSV('transfers.csv');
                const transMap = new Map();
                for (let i = 0; i < transData.length; i++) {
                    let row = transData[i];
                    let pid = row.player_id;
                    if (!transMap.has(pid)) transMap.set(pid, new Set());
                    if (row.to_club_id) transMap.get(pid).add(row.to_club_id);
                }
                transData.length = 0;

                statusEl.innerText = "Kadro Harmanlanıyor... (3/3)";
                const playersData = await parseCSV('players.csv');
                dbPlayers = playersData.map(row => {
                    let pid = row.player_id;
                    let app = appsMap.get(pid) || {g:0, a:0, r:0, comps: new Set()};
                    let trans = transMap.get(pid) || new Set();
                    
                    let birthYear = row.date_of_birth && row.date_of_birth.length >= 4 ? parseInt(row.date_of_birth.substring(0, 4)) : 0;
                    let calculatedAge = birthYear > 0 ? (2026 - birthYear) : 0;

                    return {
                        id: pid,
                        name: row.name || "",
                        img: row.image_url || "https://cdn.sofifa.net/players/notfound_0_120.png",
                        nat: row.country_of_citizenship ? String(row.country_of_citizenship).toLowerCase() : "",
                        foot: row.foot ? String(row.foot).toLowerCase() : "",
                        age: calculatedAge,
                        hgt: parseInt(row.height_in_cm || 0),
                        mv: parseInt(row.highest_market_value_in_eur || 0),
                        g: app.g,
                        a: app.a,
                        r: app.r,
                        comps: Array.from(app.comps),
                        teams: trans.size
                    };
                });
                
                playersData.length = 0;
                appsMap.clear();
                transMap.clear();

                statusEl.innerText = `İşlem Tamam! Toplam: ${dbPlayers.length} Oyuncu.`;
                statusEl.style.color = "#2ecc71";
                document.getElementById("start-btn").disabled = false;

            } catch (err) {
                statusEl.innerText = "HATA: Dosyalar okunamadı! İsimleri kontrol et (players.csv vb.)";
                statusEl.style.color = "#e74c3c";
                console.error(err);
            }
        }

        // HANGİ MEVKİYE HANGİ KATEGORİ GELECEĞİNİ BELİRLEYEN FONKSİYON
        function getCategoryForPos(pos) {
            if(pos === "GK") return "gk";
            if(["CB", "LB", "RB"].includes(pos)) return "def";
            if(["CM", "RM", "LM", "CDM", "CAM"].includes(pos)) return "mid";
            if(["ST", "RW", "LW"].includes(pos)) return "att";
            return "genel";
        }

        // MEVKİYE GÖRE KURA ÇEKİMİ
        function generateDailyGrid() {
            const today = new Date();
            const dateString = today.getFullYear() + "" + today.getMonth() + "" + today.getDate();
            const rnd = mulberry32(parseInt(dateString));

            const formKeys = Object.keys(dizilisler);
            const selKey = formKeys[Math.floor(rnd() * formKeys.length)];
            dailyFormationLayout = dizilisler[selKey];

            let slotIndex = 0;
            todayGrid = {};

            dailyFormationLayout.forEach(rowArr => {
                rowArr.forEach(pos => {
                    let cat = getCategoryForPos(pos);
                    
                    // %50 ihtimalle kendi mevkisine özel şart, %50 ihtimalle genel şart gelir
                    let pool = (rnd() > 0.5 && kriterler[cat].length > 0) ? kriterler[cat] : kriterler.genel;
                    
                    let selKriter = pool[Math.floor(rnd() * pool.length)];
                    
                    todayGrid[`slot-${slotIndex}`] = {
                        pos: pos,
                        kriterData: selKriter
                    };
                    slotIndex++;
                });
            });
        }

        window.onload = () => {
            generateDailyGrid(); 
            loadAllDatabases(); 
            const savedName = localStorage.getItem("grid11_username");
            if (savedName) document.getElementById("nickname-input").value = savedName;
        };

        // ARAMADA KODU ÇÖKERTEN BOŞLUK HATASINI DÜZELTTİĞİM YER
        function normalizeMetin(m) {
            if(!m) return "";
            try {
                return String(m).replace(/İ/g, 'i').replace(/I/g, 'i').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            } catch(e) {
                return "";
            }
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) return alert("En az 3 harfli bir nickname gir.");
            
            username = input;
            localStorage.setItem("grid11_username", username);
            document.getElementById("capture-title").innerText = `${username}'in İlk 11'i`;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            
            renderPitch();
        }

        function renderPitch() {
            const pitch = document.getElementById("pitch");
            pitch.innerHTML = "";
            let slotIndex = 0;

            dailyFormationLayout.forEach(rowArr => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                rowArr.forEach(pos => {
                    const slotId = `slot-${slotIndex}`;
                    const data = todayGrid[slotId];
                    
                    rowDiv.innerHTML += `
                        <div class="slot-container" id="${slotId}-container">
                            <div class="slot" id="${slotId}-btn" onclick="openSearch('${slotId}')">+</div>
                            <div class="pos-badge">${data.pos}</div>
                            <div class="player-name" id="${slotId}-name"></div>
                            <div class="criteria">${data.kriterData.text}</div>
                        </div>
                    `;
                    slotIndex++;
                });
                pitch.appendChild(rowDiv);
            });
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            activeSlotId = slotId;
            document.getElementById("search-pos-title").innerText = todayGrid[slotId].pos + " Aranıyor";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) { 
            document.getElementById(modalId).style.display = "none"; 
        }

        // ARAMA DÜZELTİLDİ VE GÜVENLİ HALE GETİRİLDİ
        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeMetin(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 3) return;

            const filtered = dbPlayers.filter(p => p.name && normalizeMetin(p.name).includes(val)).slice(0, 15);
            
            filtered.forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}"> ${player.name}`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
            
            if(filtered.length === 0) {
                resultsBox.innerHTML = "<div style='color:#bdc3c7; text-align:center; padding:10px;'>Oyuncu bulunamadı...</div>";
            }
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqKriter = todayGrid[activeSlotId].kriterData;
            const kurallarSaglandi = reqKriter.check(player);
            
            if (kurallarSaglandi) {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${player.img})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "inline-block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => { 
                        document.getElementById("final-share-btn").style.display = "block"; 
                        window.scrollTo(0, document.body.scrollHeight); 
                    }, 500);
                }
            } else {
                const inputField = document.getElementById("searchInput");
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        function generateShareImage() {
            const captureArea = document.getElementById("capture-area");
            const shareBtn = document.getElementById("final-share-btn");
            shareBtn.innerText = "YÜKLENİYOR...";
            html2canvas(captureArea, { backgroundColor: "#0a1f12", scale: 2, useCORS: true }).then(canvas => {
                generatedImageData = canvas.toDataURL("image/jpeg", 0.9);
                document.getElementById("generated-image-preview").src = generatedImageData;
                document.getElementById("result-modal").style.display = "flex";
                shareBtn.innerText = "PAYLAŞ";
            });
        }
        
        function downloadImage() { 
            const link = document.createElement('a'); 
            link.download = `Grid11_${username}_Skor${score}.jpg`; 
            link.href = generatedImageData; 
            link.click(); 
        }
        
        async function shareToApps() {
            if (!navigator.share) return alert("Tarayıcın desteklemiyor. 'Resmi İndir' butonunu kullan.");
            try {
                const blob = await (await fetch(generatedImageData)).blob();
                await navigator.share({ 
                    title: 'Grid 11 Kadrom', 
                    text: `Bugünkü Grid 11'i ${score} skorla bitirdim!`, 
                    files: [new File([blob], 'grid11.jpg', { type: 'image/jpeg' })] 
                });
            } catch (error) {}
        }
    </script>
</body>
</html>
