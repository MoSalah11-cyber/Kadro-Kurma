<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bil Bakalım Kim? / Günün Gridi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0a1f12 0%, #020604 100%);
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #flash-effect {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-out;
        }

        .flash-active { opacity: 1 !important; transition: none !important; }

        #login-screen {
            text-align: center;
            background: rgba(15, 45, 25, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }

        #login-screen h1 {
            margin-top: 0;
            color: #2ecc71;
            font-size: 32px;
            font-weight: 800;
        }

        #nickname-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus { border-color: #2ecc71; }

        .play-btn {
            background: #555;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 800;
            cursor: not-allowed;
            transition: 0.3s;
            font-family: inherit;
        }

        .play-btn:disabled { background: #555 !important; transform: none !important; }
        .play-btn.active-btn { background: #27ae60; cursor: pointer; }
        .play-btn.active-btn:hover { background: #2ecc71; transform: translateY(-2px); }

        #db-status {
            font-size: 14px;
            color: #f1c40f;
            margin-top: 15px;
            font-weight: 600;
        }

        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .user-info { font-size: 20px; color: #2ecc71; font-weight: 800; }
        .score-box {
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 8px;
            color: #f1c40f;
            border: 1px solid rgba(241, 196, 15, 0.3);
            font-size: 18px;
            font-weight: 800;
        }

        .pitch {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 5px;
        }

        .row {
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 15px;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            text-align: center;
        }

        .slot {
            width: 65px;
            height: 85px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            background-size: cover;
            background-position: center top;
            font-size: 24px;
            color: rgba(255,255,255,0.3);
        }

        .slot.filled {
            border: 2px solid #2ecc71;
            color: transparent; 
        }

        .pos-badge {
            background: #000;
            font-size: 12px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: -10px;
            z-index: 2;
            border: 1px solid #f1c40f;
            color: #f1c40f;
        }

        .criteria {
            font-size: 11px;
            margin-top: 6px;
            color: #bdc3c7;
            line-height: 1.1;
            font-weight: 600;
        }

        .player-name {
            font-size: 10px;
            font-weight: 800;
            margin-top: 4px;
            color: #fff;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 2px 4px;
            border-radius: 4px;
        }

        #final-share-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        #final-share-btn:hover { background: #2ecc71; color: #fff; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #search-modal-content {
            background: #111;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #2ecc71;
            font-size: 20px;
            font-weight: 800;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            background: rgba(0,0,0,0.4);
            color: #fff;
        }

        input[type="text"]:focus { border-color: #2ecc71; }
        input[type="text"].error { border-color: #e74c3c; animation: shake 0.4s; }

        .results {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .player-item img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            margin-right: 15px;
            object-fit: cover;
        }

        #result-modal-content {
            background: transparent;
            padding: 0;
            border: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #ss-card {
            background-color: #0b1c11; 
            border: 2px solid #2ecc71; 
            border-radius: 12px;
            padding: 20px;
            width: 85%; 
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }

        .close-btn {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-family: inherit;
            cursor: pointer;
            font-size: 18px;
            font-weight: 800;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="flash-effect"></div>

    <div id="login-screen">
        <h1>GÜNÜN GRİDİ</h1>
        <input type="text" id="nickname-input" placeholder="Nickini gir..." autocomplete="off">
        <button class="play-btn" id="start-btn" onclick="startGame()" disabled>OYNA</button>
        <div id="db-status">Veritabanı Yükleniyor... Lütfen Bekle ⏳</div>
    </div>

    <div id="game-container">
        <div class="header">
            <div class="user-info" id="display-nickname">---</div>
            <div class="score-box">Skor: <span id="scoreVal">0</span></div>
        </div>

        <div class="pitch" id="pitch"></div>
        <button id="final-share-btn" onclick="showShareScreen()">PAYLAŞ</button>
    </div>

    <div class="modal" id="search-modal">
        <div id="search-modal-content">
            <div class="search-header">
                <span id="search-pos-title">ARANIYOR</span>
                <span style="cursor: pointer; color:#e74c3c;" onclick="closeModal('search-modal')">✖</span>
            </div>
            <input type="text" id="searchInput" placeholder="Topçu ara (Örn: Cunha)..." autocomplete="off">
            <div class="results" id="resultsList"></div>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div id="result-modal-content">
            <div id="ss-card">
                <h2 id="ss-title" style="margin: 0 0 10px 0; color: #fff; text-align: center; text-transform: uppercase;">---'in Kadrosu</h2>
                <div style="text-align: center; margin-bottom: 15px;">
                    <span id="ss-score" style="background:#f1c40f; color:#000; padding:4px 15px; border-radius:20px; font-weight:800;">Skor: 0</span>
                </div>
                <div id="ss-pitch-container"></div>
            </div>
            <button class="close-btn" onclick="shareOrDownload()">İNDİR / PAYLAŞ</button>
            <button class="close-btn" style="background:#e74c3c; color:#fff; margin-top:10px;" onclick="closeModal('result-modal')">KAPAT</button>
        </div>
    </div>

    <script>
        let score = 0;
        let filledCount = 0;
        let activeSlotId = null;
        let username = "";
        
        let dailyFormationLayout = [];
        let todayGrid = {};
        let dbPlayers = []; 

        // Virgülleri güvenli ayıran hızlı parselleyici
        const parseRow = (str) => {
            let arr = [], quote = false, val = '';
            for (let i = 0; i < str.length; i++) {
                let cc = str[i];
                if (cc === '"') quote = !quote;
                else if (cc === ',' && !quote) { arr.push(val.trim()); val = ''; }
                else val += cc;
            }
            arr.push(val.trim());
            return arr;
        };

        async function loadLargeDatabase() {
            const statusEl = document.getElementById("db-status");
            const startBtn = document.getElementById("start-btn");
            
            try {
                // Zaman damgası ekleyerek tarayıcının önbelleği (cache) atlamasını sağlıyoruz
                const response = await fetch('./players.csv?v=' + new Date().getTime());
                
                if(!response.ok) throw new Error("CSV bulunamadı!");
                
                const dataText = await response.text();
                const lines = dataText.split('\n');
                const headers = parseRow(lines[0].toLowerCase());
                
                // Başlıkların kaçıncı sütunda olduğunu dinamik buluyoruz
                const nameIdx = headers.indexOf('name');
                const posIdx = headers.indexOf('position');
                const subPosIdx = headers.indexOf('sub_position');
                const nationIdx = headers.indexOf('country_of_citizenship');

                const loadedPlayers = [];

                for(let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    if(!line || line.trim() === "") continue;
                    
                    const cols = parseRow(line);
                    
                    const pName = cols[nameIdx] || '';
                    const pNat = (cols[nationIdx] || '').toLowerCase();
                    const pPos = ((cols[posIdx] || '') + " " + (cols[subPosIdx] || '')).toUpperCase();

                    if(pName.length < 2) continue;

                    let pos = "CM";
                    if(pPos.includes("GOALKEEPER")) pos = "GK";
                    else if(pPos.includes("CENTRE-BACK")) pos = "CB";
                    else if(pPos.includes("LEFT-BACK")) pos = "LB";
                    else if(pPos.includes("RIGHT-BACK")) pos = "RB";
                    else if(pPos.includes("MIDFIELD") || pPos.includes("CENTRAL")) pos = "CM";
                    else if(pPos.includes("WINGER") || pPos.includes("LEFT") || pPos.includes("RIGHT")) pos = "RM";
                    else if(pPos.includes("FORWARD") || pPos.includes("ATTACK") || pPos.includes("STRIKER")) pos = "ST";

                    const traits = ["herkes"];
                    if(pNat.includes("turkey") || pNat.includes("türkiye")) traits.push("turkiye");
                    if(pNat.includes("brazil")) traits.push("brezilya");
                    if(pNat.includes("argentina")) traits.push("arjantin");
                    if(pNat.includes("germany")) traits.push("almanya");
                    if(pNat.includes("england")) traits.push("ingiltere");
                    if(pNat.includes("spain")) traits.push("ispanya");

                    const imgUrl = "https://cdn.sofifa.net/players/notfound_0_120.png";
                    loadedPlayers.push({ name: pName, pos: pos, img: imgUrl, traits: traits });
                }

                dbPlayers = loadedPlayers;
                
                if(dbPlayers.length > 0) {
                    statusEl.innerText = `✓ ${dbPlayers.length} Topçu Yüklendi!`;
                    statusEl.style.color = "#2ecc71";
                    startBtn.disabled = false;
                    startBtn.classList.add("active-btn");
                } else {
                    throw new Error("Dosya boş okundu.");
                }
                
            } catch (err) {
                console.log("Hata:", err);
                statusEl.innerText = "HATA: CSV dosyası okunurken sorun çıktı. GitHub Pages'in güncellenmesi için 2-3 dakika bekleyip sayfayı yenile.";
                statusEl.style.color = "#e74c3c";
            }
        }

        const dizilisler = {
            "442": [["ST", "ST"], ["RM", "CM", "CM", "RM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "433": [["RM", "ST", "RM"], ["CM", "CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "4231": [["ST"], ["RM", "CM", "RM"], ["CM", "CM"], ["LB", "CB", "CB", "RB"], ["GK"]],
            "352": [["ST", "ST"], ["RM", "CM", "CM", "CM", "RM"], ["CB", "CB", "CB"], ["GK"]]
        };

        const kriterler = {
            GK: [{ text: "Herhangi Bir Kaleci", trait: "herkes" }],
            FB: [{ text: "Herhangi Bir Bek", trait: "herkes" }],
            CB: [{ text: "Herhangi Bir Stoper", trait: "herkes" }],
            CM: [{ text: "Herhangi Bir Orta Saha", trait: "herkes" }],
            WING: [{ text: "Herhangi Bir Kanat", trait: "herkes" }],
            ST: [{ text: "Herhangi Bir Forvet", trait: "herkes" }],
            GENEL: [
                { text: "Brezilyalı", trait: "brezilya" },
                { text: "Arjantinli", trait: "arjantin" },
                { text: "Türk", trait: "turkiye" },
                { text: "Alman", trait: "almanya" },
                { text: "İngiliz", trait: "ingiltere" },
                { text: "İspanyol", trait: "ispanya" }
            ]
        };

        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function generateDailyGrid() {
            const today = new Date();
            const dateString = today.getFullYear() + "" + today.getMonth() + "" + today.getDate();
            const rnd = mulberry32(parseInt(dateString));

            const formKeys = Object.keys(dizilisler);
            const selKey = formKeys[Math.floor(rnd() * formKeys.length)];
            dailyFormationLayout = dizilisler[selKey];

            let slotIndex = 0;
            todayGrid = {};

            dailyFormationLayout.forEach(rowArr => {
                rowArr.forEach(pos => {
                    let pool = kriterler.GENEL; 
                    const selectedCriterion = pool[Math.floor(rnd() * pool.length)];
                    
                    todayGrid[`slot-${slotIndex}`] = {
                        pos: pos,
                        criteriaText: selectedCriterion.text,
                        reqTrait: selectedCriterion.trait
                    };
                    slotIndex++;
                });
            });
        }

        window.onload = () => {
            generateDailyGrid(); 
            
            const savedName = localStorage.getItem("grid11_username");
            if (savedName) {
                document.getElementById("nickname-input").value = savedName;
            }
            
            // Oyuna girmeden önce yüklemeyi ZORUNLU kılıyoruz.
            loadLargeDatabase(); 
        };

        function normalizeMetin(metin) {
            return metin.replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                        .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function startGame() {
            const input = document.getElementById("nickname-input").value.trim();
            if(input.length < 3) return alert("En az 3 harf girmelisin.");
            
            username = input;
            localStorage.setItem("grid11_username", username);
            document.getElementById("display-nickname").innerText = username;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            renderPitch();
        }

        function renderPitch() {
            const pitch = document.getElementById("pitch");
            pitch.innerHTML = "";
            let slotIndex = 0;

            dailyFormationLayout.forEach(rowArr => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                rowArr.forEach(pos => {
                    const slotId = `slot-${slotIndex}`;
                    const data = todayGrid[slotId];
                    rowDiv.innerHTML += `
                        <div class="slot-container" id="${slotId}-container">
                            <div class="slot" id="${slotId}-btn" onclick="openSearch('${slotId}')">+</div>
                            <div class="pos-badge">${data.pos}</div>
                            <div class="player-name" id="${slotId}-name"></div>
                            <div class="criteria">${data.criteriaText}</div>
                        </div>
                    `;
                    slotIndex++;
                });
                pitch.appendChild(rowDiv);
            });
        }

        function openSearch(slotId) {
            if (document.getElementById(`${slotId}-btn`).classList.contains("filled")) return;
            activeSlotId = slotId;
            document.getElementById("search-pos-title").innerText = todayGrid[slotId].pos + " ARANIYOR";
            const input = document.getElementById("searchInput");
            input.value = "";
            input.classList.remove("error");
            document.getElementById("resultsList").innerHTML = "";
            document.getElementById("search-modal").style.display = "flex";
            setTimeout(() => input.focus(), 10);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const val = normalizeMetin(e.target.value);
            const resultsBox = document.getElementById("resultsList");
            resultsBox.innerHTML = "";
            this.classList.remove("error");

            if (val.length < 2) return;

            const filtered = dbPlayers.filter(p => normalizeMetin(p.name).includes(val));

            filtered.slice(0, 15).forEach(player => {
                const div = document.createElement("div");
                div.className = "player-item";
                div.innerHTML = `<img src="${player.img}" alt="face"> ${player.name} (${player.pos})`;
                div.onclick = () => attemptPlacePlayer(player);
                resultsBox.appendChild(div);
            });
        });

        function attemptPlacePlayer(player) {
            score++;
            document.getElementById("scoreVal").innerText = score;
            
            const reqTrait = todayGrid[activeSlotId].reqTrait;
            const inputField = document.getElementById("searchInput");

            if (player.traits.includes(reqTrait) || reqTrait === "herkes") {
                const slotBtn = document.getElementById(`${activeSlotId}-btn`);
                const nameLabel = document.getElementById(`${activeSlotId}-name`);
                
                slotBtn.style.backgroundImage = `url(${player.img})`;
                slotBtn.classList.add("filled");
                slotBtn.innerHTML = "";
                nameLabel.innerText = player.name;
                nameLabel.style.display = "inline-block";
                
                filledCount++;
                closeModal('search-modal');

                if (filledCount === 11) {
                    setTimeout(() => {
                        document.getElementById("final-share-btn").style.display = "block";
                        window.scrollTo(0, document.body.scrollHeight);
                    }, 500);
                }
            } else {
                inputField.classList.remove("error");
                void inputField.offsetWidth; 
                inputField.classList.add("error");
            }
        }

        function showShareScreen() {
            const flash = document.getElementById("flash-effect");
            flash.classList.add("flash-active");
            setTimeout(() => flash.classList.remove("flash-active"), 80);

            document.getElementById("ss-title").innerText = `${username}'in Kadrosu`;
            document.getElementById("ss-score").innerText = `Skor: ${score}`;
            document.getElementById("ss-pitch-container").innerHTML = document.getElementById("pitch").innerHTML;
            
            document.getElementById("result-modal").style.display = "flex";
        }

        function shareOrDownload() {
            const card = document.getElementById("ss-card");
            html2canvas(card, { backgroundColor: "#020604", scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL("image/jpeg", 0.9);
                const link = document.createElement('a');
                link.download = `Grid11_${username}_Skor${score}.jpg`;
                link.href = imgData;
                link.click();
            });
        }
    </script>
</body>
</html>
